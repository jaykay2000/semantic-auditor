# Claim types a message can make, and where each one's true value is read (the first source that reads).
# Truth is taken from the state snapshot in force when the message was shown, never a later one.
- id: units_left
  unit: seats_or_rooms
  sources: [{oracle: inventory, field: seats_left}, {oracle: room_inventory, field: rooms_left}]
- id: fee_total
  unit: EUR
  sources: [{oracle: booking, field: charges, match_feature: what, take: amount_cents, scale: 0.01}]   # a fee vs the claiming feature's own charges
- id: fee_per_traveller                 # no oracle: unverifiable, never "false"
  unit: EUR
