name: Northbound
fictional: true            # Contributor-mode endpoints are allowed only for fictional targets
data: synthetic
base_url: http://127.0.0.1:8765
release_env: NORTHBOUND_RELEASE
releases: ["2.3", "2.4", "2.4.1"]
hooks:
  reset: POST /api/test/reset
  persona: POST /api/test/personas
  clock: POST /api/test/clock
  world: POST /api/test/world
launch:                    # how `semaudit capture` starts the app, once per release, on a free port
  cwd: ..                  # relative to this contract directory: examples/northbound/
  cmd: ["{python}", "-m", "uvicorn", "northbound.app:app", "--host", "127.0.0.1", "--port", "{port}", "--log-level", "warning"]
  env: {NORTHBOUND_OUTBOX: "{scratch}/outbox"}
  sink_root: "{scratch}"   # surfaces.yaml sinks (outbox/email, outbox/push) are resolved under this
  health: /
adapter: ../adapter.py     # scenario-verb adapter, a path relative to this contract directory
