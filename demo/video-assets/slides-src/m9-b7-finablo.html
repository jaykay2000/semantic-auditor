<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>m9 beat 7 Finablo on the next release: the right limit in all eight places</title>
<link rel="stylesheet" href="slides.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="v9.css">
<!-- Beat 7 v9 (2:23-2:35.5, 12.5 s). Voice-over, cue = clip seconds:
       0.3  "And my app? That bug is now one of SRA's journeys."            v706: eight places, two wrong figures
       4.9  "On the next release, all eight places that state the limit"     v707: tiles flip one by one (6.5-8.6)
      10.3  "read thirty-five thousand seven hundred fifty."                 "$35,750 in all 8" at 9.6
     The numbers are the focus (owner review): each tile is one step of the harness's model-free target_61 journey
     that states the limit, with the figure it states on each release (window.DATA.v9.finablo.limits.places, counted
     from the captures by extract_v9.py). No HOLD/SHIP badge: SRA's review of v706 -> v707 is provisional with other
     issues open, so no ship verdict exists to show. The "unused 401(k) headroom" line is wrong on both releases and is
     not counted here (it is not a limit statement; fixed in v708; docs/evidence/imported-checks/finablo/README.md). -->
<style>
.rels{display:grid;grid-template-columns:200px 1fr;gap:20px 30px;align-items:center}
.rl{font:760 44px var(--disp);letter-spacing:-.02em}
.rl span{display:block;font:600 24px var(--mono);color:var(--ink3);letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{padding:14px 18px;border-radius:16px;border:2px solid;display:flex;flex-direction:column;gap:2px}
.tile b{font:820 44px/1.05 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile span{font:600 24px/1.2 var(--sans);color:var(--ink2)}
.tile.bad{background:var(--badbg);border-color:#F3C2BB}.tile.bad b{color:var(--bad)}
.tile.good{background:var(--goodbg);border-color:#9FD3B6}.tile.good b{color:var(--good)}
.sumr{grid-column:2;display:flex;align-items:center;gap:18px;font:650 30px var(--sans);color:var(--ink2);min-height:56px}
.sumr b{font:850 52px var(--disp);letter-spacing:-.03em}
.lead{font:800 56px/1.05 var(--disp);letter-spacing:-.035em;margin:0 0 30px}
</style></head><body data-duration="12.5">
<div id="hd"></div>
<div class="stage">
  <div class="lead in" style="--at:.3">Every step of this journey that states the 401(k) limit</div>
  <div class="rels" id="rels"></div>
</div>
<div class="src9 fade" style="--at:.3"><b>Source:</b> Finablo v706 (10ff1e3) and v707 (a183626), run locally, model-free captures of one 61-year-old test journey</div>
<script src="_v9.inc.js"></script>
<script>
const L = window.DATA.v9.finablo.limits, P = L.places, OK = window.DATA.v9.finablo.correct_limit;
document.getElementById('hd').innerHTML = v9Head({app: 'finablo', note: 'my existing app, the app under audit'});
const tiles = (rel, at, dt) => P.map((p, i) => `<div class="tile ${p[rel] === OK ? 'good' : 'bad'} pop" style="--at:${at + i * dt}"><b>${p[rel]}</b><span>${esc(p.name)}</span></div>`).join('');
const wrong = [...new Set(P.map(p => p.v706))].filter(v => v !== OK);
document.getElementById('rels').innerHTML = `
  <div class="rl in" style="--at:.8">v706<span>${window.DATA.finablo.trees.v706}</span></div><div class="tiles">${tiles('v706', 1.0, .22)}</div>
  <div class="sumr fade" style="--at:3.0"><b class="bad">${wrong.join(' and ')}</b>&nbsp;two figures, neither right</div>
  <div class="rl in" style="--at:5.2">v707<span>${window.DATA.finablo.trees.v707}</span></div><div class="tiles">${tiles('v707', 6.5, .3)}</div>
  <div class="sumr pop" style="--at:9.6"><b class="good">${OK}</b>&nbsp;in all ${P.filter(p => p.v707 === OK).length} of ${P.length}</div>`;
</script>
<script src="motion.js"></script>
</body></html>
