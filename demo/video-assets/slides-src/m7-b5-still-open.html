<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>m7 beat 5 still open in both releases</title>
<link rel="stylesheet" href="slides.css"><link rel="stylesheet" href="motion.css">
<!-- Beat 5 (1:24-1:37, 13 s). Owner decision 2026-11-01: SRA's release review page, not a storefront capture (the
     upstream screenshots are too small to read). The page shot is unchanged; the clip dims everything but the issue,
     adds the chip and a caption whose wording comes from scenes-data/beat5.json (caption_mode picks it).
     ⚠ As of 2026-11-01 the upstream issue is CLOSED by a merged fix (PR #289): the briefed caption "not yet confirmed
     by maintainers" is no longer true and is kept in the JSON only under the key "as_briefed_now_false". -->
<style>
.page{position:absolute;inset:0;background:url(img/beat5-spree-tax-line.png) 0 0/1920px 1080px}
.dim{position:absolute;background:rgba(246,246,243,.78)}
.spot{position:absolute;left:572px;top:420px;width:1218px;height:660px;border-radius:24px;box-shadow:0 0 0 4px rgba(54,81,212,.35)}
.chipx{position:absolute;left:1360px;top:436px;font:700 24px var(--sans);padding:9px 20px;border-radius:999px;
  color:var(--pre);background:var(--prebg);border:2px solid var(--preln);box-shadow:var(--shadow)}
.cap{position:absolute;left:112px;right:112px;bottom:40px;padding:18px 26px;border-radius:18px;background:#14161B;color:#fff;
  font:500 25px/1.4 var(--sans);box-shadow:0 18px 48px rgba(20,22,27,.25)}
.cap .k{display:block;font:650 16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#B9BCC4;margin-bottom:4px}
</style></head><body data-duration="13">
<div class="page"></div>
<div class="fade" style="--at:1.2">
  <div class="dim" style="left:0;top:0;width:1920px;height:410px"></div>
  <div class="dim" style="left:0;top:410px;width:562px;height:670px"></div>
  <div class="dim" style="left:1800px;top:410px;width:120px;height:670px"></div>
</div>
<div class="spot fade" style="--at:1.4"></div>
<div class="chipx pop" id="chip" style="--at:2.2"></div>
<div class="cap in" style="--at:5.0"><span class="k">Beyond these two releases</span><span id="cap"></span></div>
<script>
const B = window.DATA['beat5'];
document.getElementById('chip').textContent = B.chip;
document.getElementById('cap').textContent = B.captions[B.caption_mode];
</script>
<script src="motion.js"></script>
</body></html>
