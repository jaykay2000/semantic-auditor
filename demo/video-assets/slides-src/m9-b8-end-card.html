<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>m9 end card</title>
<link rel="stylesheet" href="slides.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="v9.css">
<!-- End card v9 (2:50-2:55, 5 s; silence or music). Second owner review: the frame judges pause on, so
     it fills the frame and is centred; the thesis without "every"; the models line names both Meta model lines the
     demo shows (the live sample page and beat 5 use Muse Spark 1.3 / 1.2 on the Meta Model API; Spree, the saved
     checks and Brightdesk use Muse Spark Open). One cost story only: no cost here. Everything is window.DATA.close
     (scenes-data/close.json; tests/test_demo_v9.py checks the commands against README.md and the models against the
     sample review's manifest). -->
<style>
body{background:#0E1014;color:#fff}
.ec{position:absolute;left:110px;right:110px;top:70px;bottom:70px;display:flex;flex-direction:column;justify-content:center;gap:40px}
.nm{display:flex;align-items:center;gap:30px}
.nm .logo{height:108px;padding:0 26px;border-radius:24px;font-size:46px;background:#fff;color:var(--ink)}
.nm .t{font:820 100px/1 var(--disp);letter-spacing:-.04em}
.th{font:720 58px/1.15 var(--disp);letter-spacing:-.025em;color:#C9D2F6}
.url{font:820 84px/1 var(--disp);letter-spacing:-.03em;color:#fff}
.url span{color:#9EA3AD}
.live{font:600 40px var(--sans);color:#C9CCD3}.live b{color:#9FE0BC;font-weight:700}
.cmd{font:500 29px/1.5 var(--mono);white-space:nowrap;color:#E6E7EA;background:#181B21;border:2px solid #2E323B;border-radius:22px;padding:22px 32px}
.cmd i{font-style:normal;color:#7C8AE8}
.bt{font:600 31px/1.35 var(--sans);color:#C9CCD3}.bt b{color:#fff}
.meta{font:600 34px/1.35 var(--sans);color:#9EA3AD}.meta b{color:#C9D2F6;font-weight:650}
</style></head><body data-duration="5">
<div class="ec">
  <div class="nm in" style="--at:0"><span class="logo">SRA</span><span class="t">Semantic Release Auditor</span></div>
  <div class="th in" style="--at:.2" id="th"></div>
  <div class="url in" style="--at:.4" id="repo"></div>
  <div class="live in" style="--at:.6" id="live"></div>
  <div class="cmd in" style="--at:.8" id="cmd"></div>
  <div class="bt in" style="--at:1.0" id="built"></div>
  <div class="meta in" style="--at:1.2" id="meta"></div>
</div>
<script src="_v9.inc.js"></script>
<script>
const C = window.DATA.close;
const strip = u => u.replace(/^https:\/\//, '');
document.getElementById('th').textContent = C.thesis;
document.getElementById('repo').innerHTML = `<span>${esc(strip(C.repo_url).split('/')[0])}/</span>${esc(strip(C.repo_url).split('/').slice(1).join('/'))}`;
if (C.sample_url) document.getElementById('live').innerHTML = `Live sample review: <b>${esc(strip(C.sample_url))}</b>`;
else document.getElementById('live').remove();
document.getElementById('cmd').innerHTML = C.run.map(c => `<i>$</i> ${esc(c)}`).join('<br>');
document.getElementById('built').innerHTML = `<b>Built during the hackathon, ${esc(C.built.dates)}:</b> ${C.built.items.map(esc).join(' · ')}`;
document.getElementById('meta').innerHTML = `${esc(C.owner)} · open source, Apache-2.0<br><b>${esc(C.models)}</b>`;
</script>
<script src="motion.js"></script>
</body></html>
