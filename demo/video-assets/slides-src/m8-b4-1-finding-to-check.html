<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>m8 beat 4, transition 1: a finding becomes an approved check</title>
<link rel="stylesheet" href="slides.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="v8.css"><link rel="stylesheet" href="_b4.css">
<!-- Beat 4, transition 1 (about 0:50-1:06). Voice-over v7:
       0.0  "Here's a real example from Spree, an open-source store."
       2.6  "An agent reported an order email whose numbers didn't add up."       -> the finding, in the agent's words
       7.2  "Muse Spark Open turns that report into a shopper journey"           -> each phrase lights the step it became
      10.6  "and a rule: the breakdown must add up to the total."                -> the check's rule, verbatim
      13.4  "The owner approves it."                                             -> the approval record, verbatim
     Everything is read from scenes-data/beat4.json. The approval line is printed exactly as the run recorded it:
     if it still says "owner has not reviewed this digest", the voice-over line does not match and must wait. -->
<style>
.grid{position:absolute;left:112px;right:112px;top:262px;bottom:78px;display:grid;grid-template-columns:690px 120px 1fr;gap:0}
.find{padding:28px 30px;display:flex;flex-direction:column;gap:18px;align-self:start}
.find .claim{font:650 31px/1.3 var(--disp);letter-spacing:-.012em}
.hl{border-radius:6px;transition:none}
.claim .hl.on{background:var(--badbg);box-shadow:0 0 0 4px var(--badbg);color:var(--bad)}
.repro{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.repro .ch{font:600 21px var(--sans);padding:6px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk);color:var(--ink)}
.repro .ch.used{background:var(--accentbg);border-color:var(--accentln);color:var(--accent)}
.repro i{font-style:normal;color:var(--ink3)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:150px;gap:10px}
.mid .arrow{font:500 64px var(--disp);color:var(--accent);line-height:1}
.mid .who{font:650 17px/1.25 var(--sans);color:var(--accent);text-align:center}
.rcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.jr{padding:18px 26px 14px}
.jr table{width:100%;border-collapse:collapse}
.jr td{padding:2px 0;font-size:21px;line-height:1.25;border-top:1.5px solid var(--line2)}
.jr tr:first-child td{border-top:none}
.jr td.n{width:40px;color:var(--ink3);font:600 18px var(--mono)}
.jr td.v{width:300px;font:600 20px var(--mono);color:var(--ink)}
.jr td.w{color:var(--ink2)}
.jr td.w em{color:var(--ink3)}
.rule{padding:16px 26px;background:var(--panel)}
.rule .t{font:700 26px var(--disp);letter-spacing:-.01em;margin:6px 0 6px}
.rule .s{font-size:22px;line-height:1.34;color:var(--ink2)}
.rule .s .k{color:var(--ink);font-weight:650;background:#FFF6D6;box-shadow:0 0 0 3px #FFF6D6;border-radius:4px}
.foot{display:flex;gap:16px;align-items:stretch}
.gate{flex:1.4;padding:14px 22px;display:flex;flex-direction:column;gap:4px;font-size:20px;color:var(--ink2)}
.gate b{color:var(--ink);font-weight:650}
.stamp{flex:1.1;padding:14px 22px;border-radius:18px;border:2.5px solid;display:flex;flex-direction:column;gap:4px}
.stamp.ok{border-color:#9FD3B6;background:var(--goodbg)}
.stamp.pending{border-color:#E9C987;background:var(--warnbg)}
.stamp .h{font:750 25px var(--disp)}
.stamp.ok .h{color:var(--good)}.stamp.pending .h{color:var(--warn)}
.stamp .by{font-size:18px;line-height:1.3;color:var(--ink2)}
.mono16{font:600 19px var(--mono)}
</style></head><body data-duration="16.5">
<div class="slide" id="root"></div>
<script>window.V8 = true;</script>
<script src="_b4.inc.js"></script>
<script>
const D = B4;
const ROW0 = 7.6, ROWDT = .3;
const claim = esc(D.finding.claim).replace(/summary doesn(&#39;|')t add up/, m => `<span class="hl" data-on="5.0">${m}</span>`);
const rowAt = n => ROW0 + (n - 1) * ROWDT;
const chips = D.finding.reproduce.map((c, i) =>
  `<span class="ch" data-first="${rowAt(Math.min(...c.steps))}">${esc(c.text)}</span>`).join('<i>→</i>');
const rows = D.journey.map(s => `<tr class="in" style="--at:${rowAt(s.n)};--dy:8px"><td class="n">${s.n}</td><td class="v">${esc(s.verb)}</td>
  <td class="w">${s.words ? '“' + esc(s.words) + '”' : '<em>prerequisite the text leaves unsaid</em>'}</td></tr>`).join('');
const stmt = esc(D.rule.statement).replace('arithmetically consistent with its total', '<span class="k">$&</span>')
  .replace('counted exactly once', '<span class="k">$&</span>').replace('matches the order record', '<span class="k">$&</span>');
const g = D.conversion.gate_problems_per_round;
document.getElementById('root').innerHTML = b4Head(1, 'A discovery becomes a check') + `
<div class="grid">
  <div class="box find in" style="--at:2.6">
    <div><span class="lbl">An AI agent's finding, as written</span> <span class="chip" style="margin-left:8px">${esc(D.finding.ref)}</span></div>
    <div class="claim">“${claim}”</div>
    <div class="lbl" style="margin-top:6px">Its steps to reproduce</div>
    <div class="repro">${chips}</div>
    
  </div>
  <div class="mid in" style="--at:7.2"><div class="arrow">→</div><div class="who">Muse Spark<br>Open drafts</div></div>
  <div class="rcol">
    <div class="box jr in" style="--at:7.3"><div class="lbl" style="margin-bottom:6px">The shopper journey · ${D.journey.length} steps, in the store driver's own verbs</div>
      <table>${rows}</table></div>
    <div class="box rule in" style="--at:10.6"><span class="lbl">The rule it keeps · checked on the order confirmation email</span>
      <div class="t">Rule ${esc(D.rule.id)} · ${esc(D.rule.title)}</div>
      <div class="s">“${stmt}”</div></div>
    <div class="foot">
      <div class="box gate in" style="--at:12.6"><span class="lbl">Gate</span>
        <span>every step traced to the agent's own words</span></div>
      <div class="stamp pop ${D.owner_reviewed ? 'ok' : 'pending'}" style="--at:13.6">
        <span class="h">✓ Approved by ${esc(D.approved_by)}</span>
        <span class="by">pinned to digest <span class="mono16">${esc(D.digest)}</span></span></div>
    </div>
  </div>
</div>` + b4Src(`check ${esc(D.check)}.yaml (sha256 ${esc(D._source.check_sha256_16)}, the file the run loaded)`);
</script>
<script src="motion.js"></script>
<script>
// each phrase of the agent's steps lights up as the journey step it became appears
onSeek(t => document.querySelectorAll('.hl').forEach(h => h.classList.toggle('on', t >= parseFloat(h.dataset.on))));
onSeek(t => document.querySelectorAll('.repro .ch').forEach(c => c.classList.toggle('used', t >= parseFloat(c.dataset.first))));
</script>
</body></html>
