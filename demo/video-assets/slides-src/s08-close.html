<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>s08 close</title>
<link rel="stylesheet" href="slides.css">
<style>
.lines{margin-top:150px;display:flex;flex-direction:column;gap:6px}
.lines div{font:750 88px/1.08 var(--disp);letter-spacing:-.035em}
.lines div span{color:var(--accent)}
.name{margin-top:72px;display:flex;align-items:center;gap:22px}
.name .logo{height:64px;padding:0 16px;border-radius:14px;font-size:28px}
.name .t{font:700 44px var(--disp);letter-spacing:-.02em}
.name .t small{display:block;font:500 30px var(--sans);color:var(--ink2);letter-spacing:0;margin-top:4px}
.foot{position:absolute;left:112px;right:112px;bottom:72px;display:flex;align-items:center;gap:16px;font:600 26px var(--sans);color:var(--ink2)}
.foot .dot{color:#C4C6CC}
.peek{position:absolute;right:0;top:150px;width:700px;height:640px;overflow:hidden;border-radius:22px 0 0 22px;border:1.5px solid var(--line);border-right:0;box-shadow:var(--shadow);background:#fff}
.peek img{display:block;width:1240px;margin:-6px 0 0 -76px}
.peek::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(246,246,243,0) 60%,rgba(246,246,243,.55))}
.repo{margin-left:auto;font:700 24px var(--mono);color:var(--unc);border:2.5px dashed var(--unc);background:var(--uncbg);border-radius:12px;padding:10px 20px}
</style></head><body>
<div class="slide">
  <div class="lines">
    <div>Rules from your <span>docs</span>,</div>
    <div>shoppers from your <span>rules</span>,</div>
    <div>truth from your <span>app</span>.</div>
  </div>
  <div class="name"><span class="logo">SRA</span><div class="t">Semantic Release Auditor<small>review the release your users actually live</small></div></div>
  <div class="peek" data-crop><img src="../page/01-spree-overview.png" alt="Release review page"></div>
  <div class="foot"><span>open source</span><span class="dot">·</span><span>Muse Spark</span><span class="repo" id="repo">REPO URL · TBD</span></div>
</div>
<script>
const u = (window.DATA['close'] || {}).repo_url;
if (u && !/TBD/.test(u)) { const r = document.getElementById('repo'); r.textContent = u; r.style.cssText = 'color:var(--ink);border:1.5px solid var(--line);background:var(--panel);font-weight:600'; }
</script>
</body></html>
