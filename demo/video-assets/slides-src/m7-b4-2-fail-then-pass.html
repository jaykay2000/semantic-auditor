<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>m7 beat 4, transition 2: older release FAIL, next release PASS</title>
<link rel="stylesheet" href="slides.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="_b4.css">
<!-- Beat 4, transition 2 (about 1:06-1:14). Voice-over v7: "On the older release it fails; on the next one, it passes."
       0.4  older release email; its lines add up one by one -> running sum vs the total it shows -> FAIL
       5.0  next release email; the one line that changed (Shipping) is marked -> sum equals the total -> PASS
       8.0  caption: Spree's own fix, PR #14725
     The email lines are the quotes the judges cited, each found in the capture (beat4.json). The running sum is plain
     addition, checked against the verdict by extract_beat4.py. The voice-over is short; the clip holds its last
     state so the editor can let the arithmetic sit for a beat. -->
<style>
.pair{position:absolute;left:112px;right:112px;top:262px;bottom:150px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.rel{padding:26px 32px;display:flex;flex-direction:column;gap:14px}
.rel .hd{display:flex;align-items:baseline;gap:14px}
.rel .hd .nm{font:700 34px var(--disp);letter-spacing:-.02em}
.rel .hd .v{font:600 22px var(--mono);color:var(--ink3)}
.mail{font:500 25px/1.25 var(--mono);background:var(--sunk);border:1.5px solid var(--line2);border-radius:14px;padding:12px 20px}
.mail .ln{display:flex;justify-content:space-between;padding:5px 8px;border-radius:8px}
.mail .ln .amt{font-variant-numeric:tabular-nums}
.mail .ln.on{background:#FFF6D6}
.mail .ln.was{background:var(--badbg);color:var(--bad);font-weight:700}
.mail .ln.chg{background:var(--goodbg);color:var(--good);font-weight:700}
.mail .ln.tot{border-top:1.5px solid var(--line);margin-top:4px;padding-top:9px;font-weight:700}
.sum{font:600 29px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink2);display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:44px}
.sum .r{font-weight:800}
.verdict{display:flex;align-items:center;gap:18px}
.big{font:800 54px var(--disp);letter-spacing:-.02em;padding:4px 26px;border-radius:16px;border:3px solid}
.big.fail{color:var(--bad);background:var(--badbg);border-color:#F3C2BB}
.big.pass{color:var(--good);background:var(--goodbg);border-color:#9FD3B6}
.verdict .sub{font-size:20px;color:var(--ink2);line-height:1.35}
.stats{font-size:17px;color:var(--ink3)}
.cap{position:absolute;left:0;right:0;bottom:84px;text-align:center;font:650 25px var(--sans);color:var(--ink)}
.cap span{background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:8px 22px}
</style></head><body data-duration="11">
<div class="slide" id="root"></div>
<script src="_b4.inc.js"></script>
<script>
const D = B4;
const ORDER = [['subtotal', ''], ['promotion', '−'], ['shipping', '+'], ['tax', '+']];
function panel(r, at, label) {
  const changed = k => k === 'shipping' && D.base.lines.shipping.amount !== D.head.lines.shipping.amount;
  const lines = ORDER.map(([k], i) => {
    const q = r.lines[k].quote, cut = q.lastIndexOf(' ');
    return `<div class="ln" data-k="${k}" data-on="${at + .9 + i * .55}" data-chg="${label === 'next' && changed(k) ? at + .5 : ''}" data-was="${label === 'older' && changed(k) ? at + .9 + ORDER.length * .55 + .6 : ''}">
      <span>${esc(q.slice(0, cut))}</span><span class="amt">${esc(q.slice(cut + 1))}</span></div>`; }).join('');
  const tq = r.lines.total.quote, tc = tq.lastIndexOf(' ');
  const terms = ORDER.map(([k, op], i) => `<span class="fade" style="--at:${at + .9 + i * .55};--d:.25s">${op ? op + ' ' : ''}${Number(r.lines[k].amount).toFixed(2)}</span>`).join('');
  const sumAt = at + .9 + ORDER.length * .55;
  const votes = Object.entries(r.votes).map(([k, v]) => `${v} ${k}`).join(', ');
  return `<div class="box rel in" style="--at:${at}">
    <div class="hd"><span class="nm">${label === 'next' ? 'Next release' : 'Older release'}</span><span class="v">${esc(r.name)}</span></div>
    <div class="lbl">Order confirmation email, as captured</div>
    <div class="mail">${lines}<div class="ln tot" data-on="${sumAt}"><span>${esc(tq.slice(0, tc))}</span><span class="amt">${esc(tq.slice(tc + 1))}</span></div></div>
    <div class="lbl">Its own lines, added up</div>
    <div class="sum">${terms}<span class="fade" style="--at:${sumAt};--d:.3s">= <span class="r ${r.adds_up ? 'good' : 'bad'}">${Number(r.sum).toFixed(2)}</span>
      ${r.adds_up ? '=' : '≠'} ${Number(r.lines.total.amount).toFixed(2)} shown</span></div>
    <div class="verdict"><span class="big ${r.assertion} pop" style="--at:${sumAt + .6}">${r.assertion.toUpperCase()}</span>
      <span class="sub fade" style="--at:${sumAt + .9}">${r.adds_up ? 'adds up to the total shown' : 'the free-shipping discount is counted twice'}<br>
      <span class="stats">${r.readings} readings: ${esc(votes)} · evidence ${esc(r.evidence.replace('_', ' '))} · replay ${esc(r.replay)}</span></span></div>
  </div>`;
}
document.getElementById('root').innerHTML = b4Head(2, 'The same check on two releases') +
  `<div class="pair">${panel(D.base, .4, 'older')}${panel(D.head, 5.0, 'next')}</div>
   <div class="cap fade" style="--at:8.2"><span>Spree's own fix, PR #14725</span></div>` + b4Src('the email lines are the quotes the judges cited, each found in the capture; the sums are plain addition');
</script>
<script src="motion.js"></script>
<script>
onSeek(t => document.querySelectorAll('.mail .ln').forEach(l => {
  const on = parseFloat(l.dataset.on), chg = l.dataset.chg ? parseFloat(l.dataset.chg) : null;
  l.classList.toggle('on', t >= on && t < on + .55 && !l.classList.contains('tot'));
  l.classList.toggle('chg', chg !== null && t >= chg);
  l.classList.toggle('was', !!l.dataset.was && t >= parseFloat(l.dataset.was));
  if (l.classList.contains('tot')) l.classList.toggle('on', t >= on);
}));
</script>
</body></html>
