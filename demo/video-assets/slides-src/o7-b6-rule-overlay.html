<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>o7 beat 6 overlay: the owner's rule and the app label</title>

<!-- Beat 6 (1:37-2:09) editor overlay, transparent PNG, 1920x1080 at 2x: place it over the live Northbound page.
     The page prints no rule text, and its own pill reads "fictional benchmark app"; the label here covers that pill
     (top left, x 507-675, y 18-47 on the page at 1920x1080). The rule card sits over the page's release header
     (verdict and tiles), which beat 6 does not use, so it never covers Maya's two messages. Rule text: examples/northbound/contract/principles.yaml P2,
     with the elisions v7's storyboard uses (marked …). -->
<style>
html,body{background:transparent!important}
.cover{position:absolute;left:500px;top:12px;height:42px;width:190px;padding:0 16px;display:flex;align-items:center;border-radius:999px;
  background:#fff;border:1.5px solid var(--line);font:500 15px var(--sans);color:var(--ink2);white-space:nowrap}
.rule{position:absolute;left:126px;right:126px;top:68px;min-height:220px;justify-content:center;padding:22px 30px;border-radius:22px;background:#14161B;
  color:#fff;box-shadow:0 18px 48px rgba(20,22,27,.25);display:flex;flex-direction:column;gap:8px}
.rule .k{font:650 18px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#B9BCC4}
.rule .t{font:500 30px/1.38 var(--sans)}
.rule .t b{font-weight:700;color:#FFE59A}
</style></head><body>
<div class="cover">fictional test app</div>
<div class="rule"><span class="k">The owner's rule · P2 · Advice that does not agree</span>
  <span class="t">“When more than one feature gives an active recommendation about the same decision, the product must …
  <b>explain the material tradeoffs</b> … before the traveller decides.”</span></div>
</body></html>
