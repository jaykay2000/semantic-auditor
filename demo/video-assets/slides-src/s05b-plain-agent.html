<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>s05b plain agent (data-driven)</title>
<link rel="stylesheet" href="slides.css"><link rel="stylesheet" href="ablation.css">
<style>
.tbd{display:inline-flex;align-items:center;justify-content:center;border:2.5px dashed var(--unc);color:var(--unc);background:var(--uncbg);border-radius:12px;font:700 30px var(--sans);padding:6px 22px}
.draft{margin-left:auto;font:800 20px var(--sans);letter-spacing:.1em;color:var(--unc);border:2.5px dashed var(--unc);background:var(--uncbg);border-radius:999px;padding:6px 18px}
.isTBD{color:var(--unc)}
.chart{grid-template-columns:480px 900px 1fr;column-gap:48px}
</style>
</head><body>
<div class="slide">
  <div class="bar"><div class="brand"><span class="logo">SRA</span>Semantic Release Auditor</div><span class="sep"></span><span class="app">Is it the model or the context?</span><span id="draft"></span></div>
  <div class="head">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="headline"></h1>
  </div>
  <div class="chart" id="chart">
    <div class="hdr">System</div><div class="hdr" id="foundhdr"></div><div class="hdr">False alarms</div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="src"><b>Source:</b> <span id="source"></span></div>
</div>
<script>
const D = window.DATA['plain-agent'];
const isNum = v => typeof v === 'number' && isFinite(v);
const txt = (id, v) => { const el = document.getElementById(id); el.textContent = v; if (/\bTBD\b/.test(v)) el.classList.add('isTBD'); };
txt('eyebrow', D.eyebrow); txt('headline', D.headline); txt('source', D.source);
if (D.status === 'TBD') document.getElementById('draft').outerHTML = '<span class="draft">DRAFT · VALUES TBD</span>';
const N = isNum(D.known_issues) ? D.known_issues : null;
document.getElementById('foundhdr').textContent = N ? `Known issues found (of ${N})` : 'Known issues found (of TBD)';
let h = '';
for (const r of D.rows) {
  let dots;
  if (N && isNum(r.found)) {
    const sz = Math.max(8, Math.min(36, Math.floor(740 / (N + (N - 1) / 3)))), gap = Math.max(3, Math.round(sz / 3));
    dots = `<span style="display:flex;gap:${gap}px">` + Array.from({length:N}, (_,i) => `<i class="${i < r.found ? 'f' : 'm'}" style="width:${sz}px;height:${sz}px;${sz<20?'border-width:2px':''}"></i>`).join('') + `</span><span class="n">${r.found}</span>`;
  } else dots = '<span class="tbd">TBD</span>';
  const fa = isNum(r.false_alarms)
    ? `<span class="n${r.false_alarms?'':' zero'}">${r.false_alarms}</span>` + (r.false_alarms <= 6 ? '<i>×</i>'.repeat(r.false_alarms) : '')
    : '<span class="tbd">TBD</span>';
  h += `<div class="row${r.highlight?' best':''}"><div class="lab"><span class="t">${r.label}</span><span class="s${/TBD/.test(r.sub)?' isTBD':''}">${r.sub}</span></div>
        <div class="dots">${dots}</div><div class="fa">${fa}</div></div>`;
}
document.getElementById('chart').insertAdjacentHTML('beforeend', h);
document.getElementById('legend').innerHTML = (N ? '<span><i class="f"></i>found</span><span><i class="m"></i>missed</span><span><b>×</b>false alarm</span>' : '') +
  `<span class="${/TBD/.test(D.note)?'isTBD':''}">${D.note}</span>`;
</script>
</body></html>
