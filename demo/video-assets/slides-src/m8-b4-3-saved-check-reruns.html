<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>m8 beat 4, transition 3: a new review loads the saved check and runs it again</title>
<link rel="stylesheet" href="slides.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="v8.css"><link rel="stylesheet" href="_b4.css">
<!-- Beat 4, transition 3 (about 1:14-1:24), the moment judges must see.
     Voice-over v7: "Then a new review loads the saved check and runs it again: fix confirmed."
       0.3  a new review: the command, typed
       1.6  the stored files, loaded and hashed one by one; nothing imported (README run 3: "run-saved; nothing imported")
       4.4  the saved check re-runs on both releases: FAIL, then PASS
       6.6  "fix confirmed", written to the decisions memory (dispositions.yaml)
     All values from beat4.json (the run's saved results; the command line from its transcript). The wall time of the
     real run (about 5 minutes) is not implied: the clip says "the run's output", not "live". -->
<style>
.cols{position:absolute;left:112px;right:112px;top:262px;bottom:96px;display:grid;grid-template-columns:1.08fr 1fr;gap:40px}
.term{align-self:start;background:#14161B;border-radius:22px;padding:26px 30px;color:#E6E7EA;font:500 21px/1.5 var(--mono);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.term .top{display:flex;justify-content:space-between;font:600 17px var(--sans);color:#9EA3AD;letter-spacing:.06em;text-transform:uppercase}
.term .cmd{color:#fff;white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere;min-height:64px}
.term .cmd::before{content:"$ ";color:#7C8AE8}
.term .ld{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.term .f{display:grid;grid-template-columns:34px 1fr auto;align-items:center;color:#D4D6DB}
.term .f .ok{color:#7DD3A5}
.term .f .h{color:#9EA3AD}
.term .none{margin-top:10px;display:inline-flex;align-self:flex-start;gap:10px;font:650 20px var(--sans);color:#14161B;background:#E6E7EA;border-radius:999px;padding:6px 16px}
.term .out{font:500 16.5px/1.45 var(--mono);color:#C9CCD3;white-space:pre-wrap;word-break:break-word;display:flex;flex-direction:column;gap:8px}
.term .out .fx{color:#7DD3A5}
.term .k{font:600 17px var(--sans);color:#9EA3AD;letter-spacing:.06em;text-transform:uppercase;margin-top:8px}
.res{display:flex;flex-direction:column;gap:20px}
.rr{display:flex;align-items:center;gap:18px;padding:20px 26px}
.rr .nm{font:700 28px var(--disp);letter-spacing:-.015em;width:210px;flex:none}
.rr .v{font:500 21px var(--sans);color:var(--ink3);flex:1;white-space:nowrap}
.mid{font:800 40px var(--disp);padding:2px 20px;border-radius:14px;border:3px solid}
.mid.fail{color:var(--bad);background:var(--badbg);border-color:#F3C2BB}
.mid.pass{color:var(--good);background:var(--goodbg);border-color:#9FD3B6}
.fix{padding:30px 34px;border-radius:24px;background:var(--goodbg);border:3px solid #9FD3B6;display:flex;flex-direction:column;gap:10px}
.fix .h{font:800 66px/1 var(--disp);letter-spacing:-.03em;color:var(--good)}
.fix .w{font-size:24px;color:var(--ink2);line-height:1.35}
.fix .m{font-size:20px;color:var(--ink3)}
.fix .m code{font:600 19px var(--mono);color:var(--ink2)}
/* v8: larger, since the vote lines are gone */
.cols{align-items:center}
.term{font-size:25px;padding:34px 36px;gap:16px}.term .top{font-size:19px}.term .ld{gap:10px}.term .none{font-size:24px;padding:8px 20px}
.res{gap:26px}.rr{padding:28px 30px}.rr .nm{font-size:34px;width:250px}.rr .v{font-size:24px}.mid{font-size:50px}
.fix{padding:40px 40px;gap:14px}.fix .h{font-size:88px}.fix .w{font-size:28px}.fix .m{font-size:23px}
</style></head><body data-duration="11">
<div class="slide" id="root"></div>
<script>window.V8 = true;</script>
<script src="_b4.inc.js"></script>
<script>
const D = B4, R = D.run;
const files = Object.entries(R.loaded_from_storage).map(([f, h], i) =>
  `<div class="f in" style="--at:${1.7 + i * .45};--dy:6px"><span class="ok">✓</span><span>${esc(f)}</span><span class="h">${esc(h)}</span></div>`).join('');
const when = R.at.replace('T', ' ').replace(/:\d\d\+00:00$/, ' UTC');
const row = (r, at, label) => `<div class="box rr in" style="--at:${at}"><span class="nm">${label}</span>
  <span class="v"><span style="font-family:var(--mono)">${esc(r.name)}</span></span><span class="mid ${r.assertion} pop" style="--at:${at + .4}">${r.assertion.toUpperCase()}</span></div>`;
document.getElementById('root').innerHTML = b4Head(3, 'The saved check, run again') + `
<div class="cols">
  <div class="term in" style="--at:.3">
    <div class="top"><span>A new review · run <span style="text-transform:none;font-family:var(--mono);letter-spacing:0">${esc(R.id)}</span></span><span>${esc(when)}</span></div>
    <div class="cmd" data-type="${esc(R.command || 'run-saved')}" data-at=".6" data-d="1.0"></div>
    <div class="k fade" style="--at:1.6">Loaded from storage, hashed</div>
    <div class="ld">${files}</div>
    <span class="none fade" style="--at:${1.9 + Object.keys(R.loaded_from_storage).length * .45}">nothing imported</span>
  </div>
  <div class="res">
    <div class="lbl in" style="--at:4.2">Check ${esc(D.check)} · approved digest <span style="font:600 18px var(--mono);text-transform:none;letter-spacing:0">${esc(D.digest)}</span> · both releases</div>
    ${row(D.base, 4.4, 'Older release')}
    ${row(D.head, 5.2, 'Next release')}
    <div class="fix pop" style="--at:6.6">
      <span class="h">✓ fix confirmed</span>
      <span class="w">${esc(D.memory.why)}</span>
      <span class="m">written to the decisions memory, <code>dispositions.yaml</code></span>
    </div>
  </div>
</div>` + b4Src(R.command ? 'command and output lines copied from the run transcript' : '');
</script>
<script src="motion.js"></script>
<script>typeAll();</script>
</body></html>
