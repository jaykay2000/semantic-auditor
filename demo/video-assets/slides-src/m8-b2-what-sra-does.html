<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>m8 beat 2 what SRA does</title>
<link rel="stylesheet" href="slides.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="v8.css">
<!-- Beat 2 v8 (0:14-0:34, 20 s). Voice-over v8: "Semantic Release Auditor does. (0.4) Test users walk your app on two
     releases. (1.6) Every page and email is kept beside the app's own records, (5.0) and Muse Spark Open reads them
     the way a user would, (8.6) against your own rules: (11.4) what's new, what's fixed, what's still broken. (13.2)"
     No numbers. The three statuses are the review page's own categories (new / resolved / pre-existing), said plainly. -->
<style>
.hero{margin-top:96px;display:flex;flex-direction:column;gap:22px}
.hero h1{font-size:100px;letter-spacing:-.035em}
.hero .lede{font-size:36px}
.flow{position:absolute;left:112px;right:112px;top:520px;height:330px;display:grid;grid-template-columns:1fr 46px 1.25fr 46px 1.25fr 46px 1.15fr;align-items:center}
.n8{background:var(--panel);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px 24px;display:flex;flex-direction:column;gap:12px;height:100%;justify-content:center}
.n8 .t{font:700 38px/1.1 var(--disp);letter-spacing:-.02em}
.n8 .g{font-size:25px;line-height:1.35;color:var(--ink2)}
.n8.model{background:var(--accentbg);border-color:var(--accentln)}.n8.model .t{color:var(--accent)}
.n8.out{background:var(--ink);border-color:var(--ink)}.n8.out .t{color:#fff}.n8.out .g{color:#B9BCC4}
.ar{text-align:center;font:500 34px var(--disp);color:var(--ink3)}
.users{display:flex;gap:10px;flex-wrap:wrap}
.users span{width:46px;height:46px;border-radius:50%;background:var(--sunk);border:1.5px solid var(--line);display:grid;place-items:center;font:700 19px var(--sans);color:var(--ink2)}
.rels{display:flex;gap:10px}.rels span{font:650 21px var(--mono);padding:6px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font:600 22px var(--sans);padding:5px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--sunk);white-space:nowrap}
.n8.out .chips span{background:#2A2D35;border-color:#4A4E58;color:#fff}
.chips .nw{color:#FFB4AA!important}.chips .fx{color:#9FE0BC!important}.chips .op{color:#F5D08A!important}
.rules{position:absolute;left:0;right:0;top:-92px;display:flex;justify-content:center}
.rules span{font:650 22px var(--sans);padding:9px 20px;border-radius:999px;background:var(--warnbg);border:1.5px solid #E9C987;color:var(--warn);white-space:nowrap}
.rules i{position:absolute;top:44px;left:50%;width:2px;height:48px;background:#E9C987}
</style></head><body data-duration="20">
<div class="slide">
  <div class="hero">
    <h1 class="in" style="--at:0">Semantic Release Auditor</h1>
    <p class="lede in" style="--at:.4">reads your app the way your users do</p>
  </div>
  <div class="flow">
    <div class="n8 in" style="--at:1.6"><span class="t">Test users</span>
      <div class="users"><span class="pop" style="--at:2.0">A</span><span class="pop" style="--at:2.2">B</span><span class="pop" style="--at:2.4">C</span><span class="pop" style="--at:2.6">D</span><span class="pop" style="--at:2.8">…</span></div>
      <span class="g">walk your app</span></div>
    <div class="ar fade" style="--at:3.2">→</div>
    <div class="n8 in" style="--at:3.2"><span class="t">Two releases</span>
      <div class="rels"><span>before</span><span>after</span></div>
      <div class="chips"><span class="pop" style="--at:5.2">every page</span><span class="pop" style="--at:5.7">every email</span><span class="pop" style="--at:6.4">the app's own records</span></div></div>
    <div class="ar fade" style="--at:8.6">→</div>
    <div class="n8 model in" style="--at:8.6;position:relative"><span class="t">Muse Spark Open</span><span class="g">reads them the way a user would</span>
      <div class="rules in" style="--at:11.4;--dy:-14px"><span>against your own rules</span><i></i></div></div>
    <div class="ar fade" style="--at:13.2">→</div>
    <div class="n8 out in" style="--at:13.2"><span class="t">Release review</span>
      <div class="chips"><span class="nw pop" style="--at:13.8">what's new</span><span class="fx pop" style="--at:14.6">what's fixed</span><span class="op pop" style="--at:15.4">what's still broken</span></div></div>
  </div>
</div>
<script src="motion.js"></script>
</body></html>
