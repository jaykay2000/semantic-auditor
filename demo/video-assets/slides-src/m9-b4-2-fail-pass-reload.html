<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>m9 beat 4, part 2: FAIL, PASS, then a fresh review reloads the check</title>
<link rel="stylesheet" href="slides.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="v9.css">
<!-- Beat 4 v10, part 2 (8.76 s), timed to the recorded voice (publish-audit/voice/word-times-v10.json, b4b). The
     contrast frame: full-bleed dark. Voice-over ([cue] = CUES entry):
       It [fails] fails on the [older] older release and [passes] passes on the next. A [fresh] fresh review reloads it
       from [storage] storage: [fix] fix confirmed.
     Sound cues: FAIL at "older", PASS at "passes".
     The memory's reason is shown with "base / head" said as "old release / new one" (second owner review); the
     words are otherwise the run's. Data: window.DATA.beat4 (run ic-owner-rec-1): each release's email lines as the judges cited them, their plain sum
     (checked by extract_beat4.py), the files the run loaded with their hashes, and the memory's verdict. -->
<style>
body{background:#0E1014;color:#fff}
.strip{position:absolute;left:96px;right:96px;top:118px;font:650 26px var(--sans)}
.strip span{padding:6px 18px;border-radius:999px;background:#1E2128;border:2px solid #3A3E48;color:#C9CCD3}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.rel{padding:30px 34px;border-radius:24px;background:#181B21;border:2px solid #2E323B;display:flex;flex-direction:column;gap:16px}
.rel .hd{display:flex;align-items:baseline;gap:16px}
.rel .hd b{font:750 40px var(--disp);letter-spacing:-.02em}
.rel .hd span{font:600 26px var(--mono);color:#9EA3AD}
.sum{font:600 32px var(--mono);color:#C9CCD3;font-variant-numeric:tabular-nums;line-height:1.45}
.sum .s{color:#7DD3A5}
.sum .x{color:#FFB4AA;font-weight:800}
.sum .ok{color:#7DD3A5;font-weight:800}
.ln{font:500 25px var(--sans);color:#9EA3AD}
.v{align-self:flex-start;font:850 64px/1 var(--disp);letter-spacing:-.02em;padding:10px 30px;border-radius:18px;border:3px solid}
.v.fail{color:#FFB4AA;background:#3A1D1A;border-color:#7A2E26}
.v.pass{color:#9FE0BC;background:#173326;border-color:#2C6B4C}
.reload{margin-top:40px;display:grid;grid-template-columns:1fr 520px;gap:40px;align-items:center}
.term{padding:24px 30px;border-radius:22px;background:#181B21;border:2px solid #2E323B;font:500 25px/1.5 var(--mono);color:#D4D6DB}
.term .k{font:650 24px var(--sans);color:#9EA3AD;margin-bottom:6px}
.term .f{display:grid;grid-template-columns:34px 1fr auto;gap:10px}
.term .f i{font-style:normal;color:#7DD3A5}.term .f em{font-style:normal;color:#9EA3AD}
.term .none{margin-top:10px;display:inline-block;font:650 24px var(--sans);color:#14161B;background:#E6E7EA;border-radius:999px;padding:4px 16px}
.fx{padding:30px 36px;border-radius:26px;background:#173326;border:3px solid #2C6B4C}
.fx b{display:block;white-space:nowrap;font:850 64px/1 var(--disp);letter-spacing:-.03em;color:#9FE0BC}
.fx span{font:500 26px/1.35 var(--sans);color:#C9CCD3}
.h9 .sra{color:#fff}.h9 .sra .logo{background:#fff;color:var(--ink)}.h9 .sep{background:#3A3E48}
</style></head><body data-duration="8.76">
<div id="hd"></div>
<div class="strip"><span>A bug Spree had already fixed (PR #14725): the proof case for a saved check</span></div>
<div class="stage" style="top:170px"><div id="root"></div></div>
<div class="src9"><b>Source:</b> run ic-owner-rec-1, saved results; files loaded from storage with the hashes the run recorded</div>
<script>
// THE cue table: the second each word starts in the recorded take (word-times-v10.json, b4b). Re-time here only.
const CUES = {fails: 0.37, older: 1.05, passes: 2.09, fresh: 3.89, storage: 5.63, fix: 6.88};
</script>
<script src="_v9.inc.js"></script>
<script>
const D = window.DATA.beat4, R = D.run;
document.getElementById('hd').innerHTML = v9Head({app: 'spree', note: 'a real open-source store', model: 'Muse Spark Open · open weights'});
const n = a => Number(a).toFixed(2);
const panel = (r, label, inCue, popCue) => {
  const L = r.lines, terms = `${n(L.subtotal.amount)} − ${n(L.promotion.amount)} + ${n(L.shipping.amount)} + ${n(L.tax.amount)}`;
  return `<div class="rel in" data-cue="${inCue}">
    <div class="hd"><b>${label}</b><span>${esc(r.name)}</span></div>
    <div class="ln">The order email's own lines, added up</div>
    <div class="sum">${terms}<br>= <span class="${r.adds_up ? 'ok' : 'x'}">${n(r.sum)}</span> ${r.adds_up ? '=' : '≠'} <span class="${r.adds_up ? 's' : ''}">${n(L.total.amount)}</span> shown</div>
    <span class="v ${r.assertion} pop" data-cue="${popCue}">${r.assertion.toUpperCase()}</span></div>`;
};
const files = Object.entries(R.loaded_from_storage).map(([f, h], i) =>
  `<div class="f in" data-cue="fresh+${(0.5 + i * .3).toFixed(2)}" style="--dy:6px"><i>✓</i><span>${esc(f)}</span><em>${esc(h)}</em></div>`).join('');
document.getElementById('root').innerHTML = `
  <div class="pair">${panel(D.base, 'Older release', 'fails+-0.12', 'older')}${panel(D.head, 'Next release', 'passes+-0.6', 'passes')}</div>
  <div class="reload">
    <div class="term in" data-cue="fresh"><div class="k">A fresh review · run ${esc(R.id)} · loaded from storage, hashed</div>${files}
      <span class="none fade" data-cue="storage+0.3">nothing imported</span></div>
    <div class="fx pop" data-cue="fix"><b>✓ fix confirmed</b><span>${esc(D.memory.why.replace(/\bthe base\b/, 'the old release').replace(/\bthe head\b/, 'the new one'))}</span></div>
  </div>`;
if (D.base.assertion !== 'fail' || D.head.assertion !== 'pass' || D.memory.status !== 'fix_confirmed') throw new Error('beat 4 data');
applyCues(CUES);
</script>
<script src="motion.js"></script>
</body></html>
