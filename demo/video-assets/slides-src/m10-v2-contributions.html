<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>m10 V2: what SRA is, its four contributions</title>
<link rel="stylesheet" href="slides.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="v9.css"><link rel="stylesheet" href="v10.css">
<!-- V2 (storyboard v14.1, at 0:17). Voice-over ([cue] = CUES entry; PROVISIONAL times, 2.3 words/s from 0.3 s,
     until the owner's V2 take exists: re-time by editing CUES only):
       [name] Semantic Release Auditor [see] checks what users see, on every release. It uses Meta's [muse] Muse Spark
       to read and to [judge] judge. It does [four] four things.
     The four cards land together on "four things", hold about 2 s, then shrink into the top-right corner, where the
     same four numbers stay as a marker for V3-V6 (marker10 in _v10.inc.js), the current one lit. Cards and their
     one-line Muse Spark jobs: window.DATA.v10.contributions (extract_v10.py; tests/test_demo_v10.py pins them). -->
<style>
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
.intro .nm{font:820 104px/1 var(--disp);letter-spacing:-.04em}
.intro .a{font:700 54px/1.15 var(--disp);letter-spacing:-.025em;color:var(--ink2)}
.intro .b{font:600 40px/1.2 var(--sans);color:var(--accent)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;transform-origin:100% 0}
@keyframes fx-shrink{from{transform:none;opacity:1}to{transform:translate(12px,-320px) scale(.16);opacity:0}}
.g4.shrink{animation:fx-shrink .8s var(--ease) calc(var(--at,0) * 1s) both}
.c4{padding:34px 32px;display:flex;flex-direction:column;gap:20px;min-height:430px}
.c4 .num{font:850 96px/.9 var(--disp);letter-spacing:-.04em;color:var(--accent)}
.c4 .t{font:780 44px/1.1 var(--disp);letter-spacing:-.025em}
.c4 .m{margin-top:auto;font:550 28px/1.32 var(--sans);color:var(--accent);background:var(--accentbg);border:2px solid var(--accentln);border-radius:16px;padding:14px 18px}
</style></head><body data-duration="13.5">
<div id="hd"></div>
<div class="intro only-out" data-outcue="four+-0.35">
  <div class="nm in" data-cue="name">Semantic Release Auditor</div>
  <div class="a in" data-cue="see">checks what users see, on every release</div>
  <div class="b in" data-cue="muse">using Meta's Muse Spark to read and to judge</div>
</div>
<div class="stage"><div class="g4 shrink" data-cue="four+2.3" id="g4"></div></div>
<div class="fade" data-cue="four+2.85" id="mk"></div>
<div class="src9 fade" style="--at:.3"><b>Source:</b> SRA's README and the evidence shown in the next four scenes</div>
<script>
// THE cue table. PROVISIONAL (2.3 words/s from 0.3 s) until the V2 take: re-time here only.
const CUES = {name: 0.3, see: 1.6, muse: 6.0, judge: 8.6, four: 9.9};
</script>
<script src="_v9.inc.js"></script><script src="_v10.inc.js"></script>
<script>
document.getElementById('hd').innerHTML = v9Head({model: 'Muse Spark · Meta'});
document.getElementById('g4').innerHTML = window.DATA.v10.contributions.map((c, i) => `<div class="card9 c4 in" data-cue="four+${(i * .12).toFixed(2)}">
  <span class="num">${c.n}</span><span class="t">${esc(c.title)}</span><span class="m">${esc(c.muse)}</span></div>`).join('');
document.getElementById('mk').innerHTML = marker10(0);
applyCues(CUES);
</script>
<script src="motion.js"></script>
</body></html>
