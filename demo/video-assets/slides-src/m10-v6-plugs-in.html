<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>m10 V6: two files plug an app in</title>
<link rel="stylesheet" href="slides.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="v9.css"><link rel="stylesheet" href="v10.css">
<!-- V6 (storyboard v15): "4 Plugs into your app". No Brightdesk, and (owner review) no adapter scroll: a long file
     argues against "plugs in". Voice-over ([cue] = CUES entry; PROVISIONAL times, 2.3 words/s from 0.3 s, from the
     v14.1 V6 line, until the owner's V6 take exists: re-time by editing CUES only):
       [four] Four: it plugs into your app. You [write] write a [contract] contract with your test users and
       [rules] rules, and an [adapter] adapter that performs their steps. It [runs] runs today on a real [store]
       store, my [finance] finance app and a [demo] demo app, and works with the [open] open-weight Muse Spark Open.
     The rules are Spree's own (contract-spree/principles.yaml as committed in spree-semaudit, published as
     jaykay2000/spree-semaudit): each rule's id and its title, the words the file gives it; rules sharing a title share
     a row. The three tiles are one real page each, the top of it (window.DATA.v10.v6.shots). The model line is Run 3c's
     record: every judgment of both saved checks on both releases by Muse Spark Open (extract_v10.py refuses otherwise). -->
<style>
.lbl{font:600 30px/1.35 var(--sans);color:var(--ink2);margin:0 0 18px}
.lbl b{color:var(--ink)}
.rf{padding:22px 30px;display:flex;flex-direction:column;gap:12px}
.rf .k9{color:var(--rule)}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 40px}
.rows div{display:grid;grid-template-columns:150px 1fr;gap:14px;font:600 29px/1.3 var(--sans);color:#3B2A00;padding:5px 0;border-top:1.5px solid var(--ruleln)}
.rows div i{font:700 24px var(--mono);font-style:normal;color:var(--rule);padding-top:3px}
.ad{display:inline-block;margin-top:16px;font:600 27px var(--sans);color:var(--ink2);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 22px}
.ad b{font:600 26px var(--mono);color:var(--ink)}
.body{position:relative}
.apps{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px;align-content:center;background:var(--bg)}
.tile{display:flex;flex-direction:column;gap:14px}
.tile .shotbox img{height:360px;object-fit:cover;object-position:0 0}
.tile b{font:760 36px var(--disp);letter-spacing:-.02em}
.tile span{font:500 27px var(--sans);color:var(--ink2)}
.osw{grid-column:1/-1;justify-self:center;margin-top:28px;font:650 30px var(--sans);color:var(--accent);background:var(--accentbg);border:2px solid var(--accentln);border-radius:999px;padding:10px 28px}
</style></head><body data-duration="21">
<div id="hd"></div><div id="mk"></div>
<div class="stage" style="justify-content:flex-start;top:132px">
  <div class="ch in" data-cue="four"><b>4</b><span>Plugs into your app</span></div>
  <div class="body" style="height:700px">
    <div class="lbl fade" data-cue="write">Two files plug an app in: <b>a contract</b> (test users, rules, where the app's records live) and <b>an adapter</b> that performs each step.</div>
    <div class="rule9 rf in" data-cue="contract"><span class="k9" id="rk"></span><div class="rows" id="rows"></div></div>
    <span class="ad fade" data-cue="adapter" id="ad"></span>
    <div class="apps in" data-cue="runs" id="apps"></div>
  </div>
</div>
<div class="src9 fade" style="--at:.3"><b>Source:</b> github.com/jaykay2000/spree-semaudit (contract-spree/principles.yaml) · saved-check run 3c · one capture per app, test users only</div>
<script>
// THE cue table. PROVISIONAL (2.3 words/s from 0.3 s, the v14.1 V6 line) until the V6 take: re-time here only.
const CUES = {four: 0.3, write: 3.3, contract: 4.2, rules: 6.8, adapter: 8.1, runs: 10.7, store: 12.9, finance: 13.8,
  demo: 15.5, open: 18.1};
</script>
<script src="_v9.inc.js"></script><script src="_v10.inc.js"></script>
<script>
const F = window.DATA.v10.v6.files, S = window.DATA.v10.v6.shots;
document.getElementById('hd').innerHTML = v9Head({app: 'spree', note: 'a real open-source store', model: 'Muse Spark Open · open weights'});
document.getElementById('mk').innerHTML = marker10(4);
document.getElementById('rk').textContent = `Spree's contract · its ${F.rules.ids.length} rules, in the file's own words · contract-spree/principles.yaml`;
document.getElementById('rows').innerHTML = F.rules.plain.map((r, i) => `<div class="fade" data-cue="rules+${(i * .1).toFixed(2)}"><i>${r.ids.map(esc).join(' ')}</i><span>${esc(r.title)}</span></div>`).join('');
document.getElementById('ad').innerHTML = `+ <b>${esc(F.adapter.path)}</b>, the adapter: performs each step`;
const tile = (app, cue) => `<div class="tile in" data-cue="${cue}"><div class="shotbox"><img src="${S[app].img}" alt="${esc(S.labels[app])}"></div>
  <b>${esc(S.labels[app].split(' · ')[0])}</b><span>${esc(S.labels[app].split(' · ').slice(1).join(' · '))}</span></div>`;
document.getElementById('apps').innerHTML = tile('spree', 'store') + tile('finablo', 'finance') + tile('northbound', 'demo') +
  `<span class="osw pop" data-cue="open">${esc(F.spree_checks.line)}</span>`;
if (!/muse-spark-open/.test(F.spree_checks.model)) throw new Error('V6 model line');
applyCues(CUES);
</script>
<script src="motion.js"></script>
</body></html>
