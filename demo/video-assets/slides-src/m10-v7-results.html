<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>m10 V7: what SRA has done so far</title>
<link rel="stylesheet" href="slides.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="v9.css"><link rel="stylesheet" href="v10.css">
<!-- V7 (storyboard v14.1): the results board, four tiles, each appearing as the voice names it; no other numbers.
     Voice-over ([cue] = CUES entry; PROVISIONAL times, 2.3 words/s from 0.3 s, until the owner's V7 take exists:
     re-time by editing CUES only):
       [app] In my app, SRA checked all eight places on the next release, and the limit was [fixed] fixed. Later it
       flagged a [regression] regression introduced in v708, which I confirmed. In [spree] Spree, I reported the bug
       it found, and the maintainers [merged] merged a fix two days later. So explore with any agent you like. SRA
       [keeps] keeps what it finds, and checks it again on every release.
     Data: window.DATA.v10.v7 (extract_v10.py): Finablo's 8 of 8 on v707 (v9.json, the model-free captures); the
     regression introduced in v708 and confirmed by the owner on a test persona (v9.json finablo_fresh, from the
     committed docs/evidence/finablo-fresh-releases-2026-11-01/counts.json); Spree's report and merge dates
     and the repository + PR number (demo/evidence/taxline-upstream-2026-10-30; that record gives the issue URL and the
     PR number, not a PR URL, so the tile shows "github.com/spree/storefront · PR #289"); the saved check C1-04 reloaded from storage by run ic-owner-rec-1
     and run on the later release (beta3), fix_confirmed. Finablo is shown with test users only. -->
<style>
.lead{font:800 60px/1.05 var(--disp);letter-spacing:-.035em;margin:0 0 40px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px}
.tl{padding:30px 30px 34px;display:flex;flex-direction:column;gap:16px;min-height:330px}
.tl .app{font:700 24px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.tl .app em{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink3)}
.tl .big{font:850 64px/1 var(--disp);letter-spacing:-.04em}
.tl .big.g{color:var(--good)}.tl .big.r{color:var(--bad)}.tl .big.s{color:var(--accent)}
.tl .ds{font:500 30px/1.35 var(--sans);color:var(--ink2)}
.tl .url{display:block;margin-top:10px;font:650 24px var(--sans);color:var(--spr);overflow-wrap:anywhere}
.tl.fin{border-top:8px solid var(--fin)}.tl.spr{border-top:8px solid var(--spr)}.tl.chk{border-top:8px solid var(--accent)}
</style></head><body data-duration="29.5">
<div id="hd"></div>
<div class="stage">
  <div class="lead in" data-cue="app">What SRA has done so far</div>
  <div class="board" id="board"></div>
</div>
<div class="src9 fade" style="--at:.3"><b>Source:</b> Finablo v707 and the v707 → v731 review (test users only) · spree/storefront issue 283, PR 289 · saved check C1-04, run ic-owner-rec-1</div>
<script>
// THE cue table. PROVISIONAL (2.3 words/s from 0.3 s) until the V7 take: re-time here only.
const CUES = {app: 0.3, fixed: 7.3, regression: 9.4, spree: 12.9, merged: 17.3, keeps: 23.3};
</script>
<script src="_v9.inc.js"></script><script src="_v10.inc.js"></script>
<script>
const B = window.DATA.v10.v7, F = B.finablo_fixed, R = B.finablo_regression, S = B.spree, K = B.saved_check;
document.getElementById('hd').innerHTML = v9Head({model: 'Muse Spark · Meta'});
const tile = (cls, cue, app, big, tone, d) => `<div class="card9 tl ${cls} in" data-cue="${cue}"><span class="app">${app}</span>
  <span class="big ${tone}">${big}</span><span class="ds">${d}</span></div>`;
document.getElementById('board').innerHTML =
  tile('fin', 'fixed', 'Finablo <em>· my app</em>', 'Fixed', 'g', `${F.right} of ${F.places} places show the right limit on the next release`) +
  tile('fin', 'regression', 'Finablo', `${R.count} regression`, 'r', `introduced in ${esc(R.introduced)}, confirmed by me on a test user`) +
  tile('spr', 'merged', 'Spree <em>· open source</em>', 'Fix merged', 'g', `merged by the maintainers ${esc(S.merged)} · reported ${esc(S.reported)}<span class="url">${esc(S.repo)}<br>PR #${S.pr}</span>`) +
  tile('chk', 'keeps', 'Saved check', 'Kept', 's', 'reloaded from storage and run again on a later release');
if (F.right !== F.places || R.count !== 1 || K.memory !== 'fix_confirmed') throw new Error('V7 data');
applyCues(CUES);
</script>
<script src="motion.js"></script>
</body></html>
