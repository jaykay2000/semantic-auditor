[project]
name = "semantic-auditor"
version = "0.0.1"
license = "Apache-2.0"
description = "Semantic Auditor: reconstructs what a user experiences across a release, finds conflicting behavior and messages, and gives reproducible evidence for a shipping decision."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "httpx>=0.27",
  "playwright>=1.45",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
demo = ["fastapi>=0.115", "uvicorn>=0.30", "fpdf2>=2.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
semaudit = "semaudit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semaudit"]
