[project]
name = "semantic-auditor"
version = "0.0.1"
license = "Apache-2.0"
description = "Semantic Auditor: reconstructs what a user experiences across a release, finds conflicting behavior and messages, and gives reproducible evidence for a shipping decision."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "httpx>=0.27",
  "playwright>=1.45",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
demo = ["fastapi>=0.115", "uvicorn>=0.30", "fpdf2>=2.7", "python-multipart>=0.0.9"]
anthropic = ["anthropic>=0.40"]
test = ["semantic-auditor[demo,anthropic]", "pytest>=8", "ruff==0.17.3"]
dev = ["semantic-auditor[test]"]

[project.scripts]
semaudit = "semaudit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semaudit"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/northbound/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["runs"]

[tool.ruff.lint]
# pyflakes + the import/statement errors (ruff's own default), import order, pyupgrade for 3.12, bugbear, and
# stale `noqa` comments.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF100"]
ignore = [
  "B008",  # typer's documented style puts typer.Option(...) in argument defaults
  "B904",  # `raise ... from`: changes the traceback a user sees; left for a separate decision
  "B905",  # zip(strict=...): would change behaviour where lengths differ; left for a separate decision
]

[tool.ruff.lint.per-file-ignores]
# The frozen converter and re-check (and their prompt text) are not edited for lint: ignore, don't rewrite.
"src/semaudit/imported/*" = ["F401", "I001", "UP017", "UP035", "UP037"]
# Files whose bytes are still pinned by sha256 in bench/conditions/FROZEN-*.md: ignored, not rewritten.
"src/semaudit/bench/judge.py" = ["B007"]
"src/semaudit/bench/match.py" = ["F401"]
"src/semaudit/capture/launcher.py" = ["UP037"]
