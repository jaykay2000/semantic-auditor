<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release review · Northbound 2.3 → 2.4</title>
<style>
/* One self-contained file: system fonts only, no network. Light theme first (it is what the demo records). */
:root{
  --bg:#F6F6F3;--panel:#FFFFFF;--sunk:#FAFAF8;--ink:#14161B;--ink2:#4A505C;--ink3:#7A808C;--line:#E3E3DE;--line2:#EEEEEA;
  --accent:#3651D4;--accentbg:#EEF1FD;--accentln:#C9D2F6;
  --new:#B42318;--newbg:#FEF1EF;--newln:#F6C9C3;
  --pre:#9A5A06;--prebg:#FEF6E6;--preln:#F1D7A6;
  --res:#127347;--resbg:#EAF6EF;--resln:#B5DEC7;
  --unc:#5A49A8;--uncbg:#F2F0FB;--uncln:#D2CBF0;
  --bad:#A8231A;--badbg:#FDE7E3;--good:#126B42;--goodbg:#E4F4EA;
  --warn:#8A5A00;--warnbg:#FCF2DC;
  --shadow:0 1px 0 rgba(20,22,27,.04),0 1px 3px rgba(20,22,27,.06);
  --sans:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --disp:"Inter Display","Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
.mono,code,pre{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
button{font:500 14px var(--sans);cursor:pointer;color:var(--ink)}
main{max-width:1720px;margin:0 auto;padding:0 32px 64px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--ink2);font-size:14px}
.faint{color:var(--ink3)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.h{font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
.tag{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--panel);white-space:nowrap}
.linkbtn{background:none;border:0;padding:0;font-family:inherit;font-size:inherit;font-weight:inherit;color:var(--accent);cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:550;white-space:nowrap}
.btn:hover{border-color:#CFCFC8}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input.btn{font-weight:400;cursor:text}
.chip{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;line-height:1.5}
.chip.n{background:#F1F1EE;color:var(--ink2)}
.chip.sev{background:#fff;border-color:var(--line);color:var(--ink)}
.chip.sev.critical{border-color:#E9B8AE;color:#8E2411}
.chip.ver{background:#fff;color:var(--good);border-color:#B5DEC7}
.chip.ver.partial{color:var(--ink2);border-color:var(--line);border-style:dashed}
.chip.conf{background:#F1F1EE;color:var(--ink2)}
.chip.sev-critical{background:var(--badbg);color:var(--bad)}
/* release delta: the one place colour carries meaning */
.d{display:inline-flex;align-items:center;gap:6px;font-weight:650;font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;letter-spacing:.01em}
.d::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.d.new{color:var(--new);background:var(--newbg);border-color:var(--newln)}
.d.pre{color:var(--pre);background:var(--prebg);border-color:var(--preln)}
.d.resolved{color:var(--res);background:var(--resbg);border-color:var(--resln)}
.d.unconfirmed{color:var(--unc);background:var(--uncbg);border-color:var(--uncln);border-style:dashed}
.d.big{font-size:14px;padding:5px 12px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:18px 0 2px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 16px var(--disp);letter-spacing:-.01em}
.logo{height:28px;padding:0 7px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 13px var(--disp);letter-spacing:-.02em}
.top .sep{width:1px;height:20px;background:var(--line)}
.top .app{font-weight:600}
.top .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* verdict band */
.verdict{padding:22px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
.verdict .rel{font:700 30px/1.15 var(--disp);letter-spacing:-.02em;margin:2px 0 10px}
.verdict .rel .arr{color:var(--ink3);font-weight:500;margin:0 10px}
.vline{font-size:16px;color:var(--ink2)}
.vline .word{font:700 24px var(--disp);letter-spacing:-.01em;color:var(--ink);margin-left:6px}
.vline .word.hold{color:var(--bad)}.vline .word.needs_owner_review{color:var(--warn)}.vline .word.ship{color:var(--good)}
.rec{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:10px;vertical-align:4px;text-transform:none}
.rec-hold{background:var(--badbg);color:var(--bad)}.rec-needs_owner_review{background:var(--warnbg);color:var(--warn)}
.rec-ship_with_notes{background:#EEF0F4;color:#2F3542}.rec-ship{background:var(--goodbg);color:var(--good)}
.rec-provisional,.rec-not_measurable{background:#fff;color:var(--ink2);border:1.5px dashed #B9BCC4}
.vwhy{font-size:13.5px;color:var(--ink2);margin-top:8px;max-width:980px;line-height:1.55}
.vwhy .mono{font-size:12.5px;color:var(--ink)}
.tiles{display:flex;gap:12px}
.tile{min-width:148px;padding:14px 18px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);text-align:left;display:flex;flex-direction:column;gap:2px}
.tile .num{font:750 44px/1 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile .lbl{font-size:14px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:7px;margin-top:6px}
.tile .lbl::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.tile.new .num,.tile.new .lbl{color:var(--new)}.tile.pre .num,.tile.pre .lbl{color:var(--pre)}
.tile.resolved .num,.tile.resolved .lbl{color:var(--res)}.tile.unconfirmed .num,.tile.unconfirmed .lbl{color:var(--unc)}
.tile.zero .num{color:#C4C6CC}.tile.zero .lbl{color:var(--ink3)}
.tile[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:1px;background:#fff}
.tile .sub{font-size:12px;color:var(--ink3)}
.reach{font-size:13px;color:var(--ink3);margin-top:8px;text-align:right}

/* workspace */
.work{display:grid;grid-template-columns:420px minmax(0,1fr);gap:18px;align-items:start}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:14px}
.group{padding:12px;display:flex;flex-direction:column;gap:6px}
.ghead{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 6px}
.ghead .t{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ghead .t.new{color:var(--new)}.ghead .t.pre{color:var(--pre)}.ghead .t.resolved{color:var(--res)}.ghead .t.unconfirmed{color:var(--unc)}
.ghead .c{font-size:13px;color:var(--ink3)}
.issue{display:flex;flex-direction:column;gap:6px;padding:11px 12px 11px 14px;border-radius:10px;border:1px solid transparent;background:none;text-align:left;width:100%;position:relative}
.issue:hover{background:var(--sunk);border-color:var(--line2)}
.issue[aria-pressed=true]{background:var(--accentbg);border-color:var(--accentln)}
.issue[aria-pressed=true]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.issue .ttl{font-size:15px;font-weight:650;line-height:1.3}
.issue .where{font-size:13px;color:var(--ink2)}
.issue .mini{font:600 13.5px var(--mono);display:flex;align-items:center;gap:8px}
.issue .mini .s{color:var(--bad)}.issue .mini .t{color:var(--good)}
.issue .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.here{font-size:12px;font-weight:650;color:var(--accent)}
.note{padding:14px 16px}
.note .big{font-size:16px;font-weight:650}
.nr{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.nrrow{font-size:13.5px;line-height:1.45;border-top:1px solid var(--line2);padding-top:8px}
.nrrow:first-of-type{border-top:0;padding-top:0}

/* lens: whose experience is on screen */
.lens{padding:14px 20px;display:flex;align-items:center;gap:16px}
.lens h1{white-space:nowrap;margin:0;font:700 22px var(--disp);letter-spacing:-.01em}
.lens .ovl{font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.lens .who{display:flex;flex-direction:column;gap:1px;min-width:0}
.lens .who .row{flex-wrap:nowrap;min-width:0}
.lens .sum{font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lens .ctl{margin-left:auto;display:flex;gap:10px;align-items:center;flex:none}
.seg{padding:7px 13px;border:1px solid var(--line);background:#fff;margin-left:-1px;font:550 13.5px var(--mono)}
.seg:first-child{border-radius:9px 0 0 9px;margin-left:0}.seg:last-child{border-radius:0 9px 9px 0;font-family:var(--sans)}
.seg[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
select{font:500 14px var(--sans);padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);max-width:340px}

/* issue detail */
.rcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.detail{padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.dhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.dhead h2{margin:8px 0 4px;font:700 26px/1.2 var(--disp);letter-spacing:-.015em}
.dhead .id{font-size:12.5px;color:var(--ink3)}
.dhead .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lead{font-size:18px;line-height:1.5;margin:0;max-width:1080px}
.lead b.s{color:var(--bad)}.lead b.t{color:var(--good)}
.why{font-size:14.5px;color:var(--ink2);margin:0;line-height:1.55}
.vs{display:grid;grid-template-columns:minmax(0,1.55fr) 44px minmax(0,1fr);align-items:stretch}
.vcard{border-radius:12px;border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.vcard.shown{background:#fff}
.vcard.true{background:var(--goodbg);border-color:#C6E6D3}
.vcard .cap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.vcard .cap b{color:var(--ink);font-weight:650}
.vcard .val{font:750 40px/1.05 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.vcard.shown .val{color:var(--bad)}
.vcard.true .val{color:var(--good)}
.vcard .src{font-size:13px;color:var(--ink2)}
.vcard .src .mono{font-size:12.5px;color:var(--ink)}
.neq{display:grid;place-items:center;font:600 28px var(--disp);color:var(--ink3)}
.text{font:14.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--sunk);border:1px solid var(--line2);border-radius:9px;padding:12px 14px;color:var(--ink);max-height:420px;overflow:hidden}
.text .cut{color:var(--ink3)}
mark{background:none;color:inherit}
mark.q{background:var(--badbg);box-shadow:0 0 0 2px var(--badbg);border-radius:3px}
mark.q b.f,.text b.f{color:var(--bad);font-weight:800;background:#F9CFC8;border-radius:3px;padding:0 2px}
mark.now{background:var(--goodbg);box-shadow:0 0 0 2px var(--goodbg);border-radius:3px}
mark.now b.f{color:var(--good);font-weight:800;background:#CDEBD9;border-radius:3px;padding:0 2px}
.shot{position:relative;width:100%;height:136px;border-radius:9px;border:1px solid var(--line);background-color:#fff;background-repeat:no-repeat;overflow:hidden;display:block}
.shot .hl{position:absolute;border:2.5px solid var(--bad);border-radius:4px;box-shadow:0 0 0 3px rgba(168,35,26,.12)}
.shot.ok .hl{border-color:var(--good)}
.rtab{display:flex;flex-direction:column;gap:2px;font-size:13.5px;margin-top:4px}
.rr{display:flex;justify-content:space-between;gap:12px;padding:3px 8px;border-radius:6px}
.rr .mono{font-size:12.5px;color:var(--ink2)}
.rr.hit{background:#CDEBD9;font-weight:700}.rr.hit .mono{color:var(--good)}
.near{display:flex;flex-direction:column;gap:3px;background:var(--sunk);border:1px solid var(--line2);border-radius:9px;padding:10px 14px}
.nr1{font:14px/1.45 var(--mono);color:var(--ink3);white-space:pre-wrap;word-break:break-word}
.nr1.me{color:var(--ink);font-size:15.5px}
.cmp{font-size:13.5px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.cmp .mono{font-size:13px;color:var(--ink)}

/* base -> head */
.relcmp{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);gap:0;align-items:stretch}
.relcol{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;background:#fff}
.relcol .rh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.relcol .rn{font:650 15px var(--mono)}
.relcol .rn small{font:500 12px var(--sans);color:var(--ink3);margin-left:6px}
.st{font-size:13px;font-weight:650;display:inline-flex;gap:6px;align-items:center}
.st.bad{color:var(--bad)}.st.good{color:var(--good)}.st.none{color:var(--ink3)}
.relcol .text{max-height:none;font-size:14px}
.arrow{display:grid;place-items:center;color:var(--ink3);font-size:20px}
.basis{font-size:13.5px;color:var(--ink2)}
.ctable{width:100%;border-collapse:collapse;font-size:14px}
.ctable th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);text-align:left;font-weight:650;padding:0 10px 6px 0}
.ctable td{border-top:1px solid var(--line2);padding:8px 10px 8px 0;vertical-align:top}

/* who */
.whobox{display:flex;flex-direction:column;gap:8px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.pchip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* trust */
.three{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.three .box{padding:14px 16px;box-shadow:none;background:var(--sunk)}
.lvl{font:700 20px var(--disp);letter-spacing:-.01em;margin-bottom:4px}
.lvl.good{color:var(--good)}.lvl.bad{color:var(--bad)}.lvl.warn{color:var(--warn)}.lvl.dim{color:var(--ink2)}
.three .muted{font-size:13px;line-height:1.5}
.vsteps{display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.4;margin-top:6px}
.vstep{display:flex;flex-direction:column;gap:0}
.vstep>span:first-child{font-weight:600}
.vstep>span:last-child{color:var(--ink3);padding-left:18px;font-size:12.5px}
.vstep.v-pass>span:first-child{color:var(--good)}.vstep.v-fail>span:first-child{color:var(--bad)}.vstep.v-not_run>span:first-child{color:var(--ink3)}
.basisl{margin:4px 0 0;padding-left:16px;font-size:13px;color:var(--ink2);line-height:1.5}
.modelstrip{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--ink2);padding:12px 16px;border-radius:12px;background:var(--sunk);border:1px solid var(--line2)}
.modelstrip b{color:var(--ink)}
.rulecard{padding:14px 16px;border-radius:12px;background:var(--sunk);border:1px solid var(--line2)}
.rulecard .rt{font-size:15px;line-height:1.55}
.repro{font-size:13px;background:var(--ink);color:#fff;padding:7px 10px;border-radius:7px}
.cond{display:grid;grid-template-columns:70px 1fr;gap:6px;font-size:13.5px}

/* moments (coherence issues): two messages side by side */
.moments{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;min-width:0}
.moment{flex:1 1 300px;display:flex;flex-direction:column;gap:9px;border-radius:12px;padding:14px 16px;border:1px solid;min-width:0}
.moment .mh{font-size:13px;color:var(--ink2)}
.quote{font-size:17px;line-height:1.5;font-weight:500}
.envelope{border-radius:8px;border:1px solid var(--line);background:#fff;padding:8px 10px;font-size:13px;color:var(--ink2)}
.swap{align-self:center;font-size:22px;color:var(--ink3)}

/* story */
.storybox{padding:20px 22px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:12px}
.storybox h3{margin:0;font:700 20px var(--disp);letter-spacing:-.01em}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.step{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.step:hover{border-color:#CFCFC8}
.step.cited{border:2px solid var(--bad);padding:9px;background:#FFFBFA}
.step[aria-pressed=true]{box-shadow:0 0 0 3px var(--accentln)}
.step .sh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.step .sn{font:650 12px var(--mono);color:var(--ink3)}
.step .sa{font-size:14.5px;font-weight:650;line-height:1.25}
.step .thumb{height:118px;border-radius:7px;border:1px solid var(--line2);background-color:#FAFAF8;background-repeat:no-repeat;background-size:100% auto;background-position:top center;position:relative;overflow:hidden}
.step .thumb .hl{position:absolute;border:2px solid var(--bad);border-radius:3px}
.step .mail{height:118px;border-radius:7px;border:1px solid var(--line2);background:var(--sunk);padding:8px 9px;font:11.5px/1.35 var(--mono);color:var(--ink2);overflow:hidden;white-space:pre-wrap}
.step .sf{font-size:12px;color:var(--ink3);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.step .cq{font:600 12.5px/1.35 var(--mono);color:var(--bad)}
.step.skip{opacity:.55}
.drawer{border-top:1px solid var(--line2);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:230px minmax(0,1fr) 90px;gap:12px;font-size:14px;padding:6px 8px;border-radius:7px;align-items:baseline}
.mrow:nth-child(odd){background:var(--sunk)}
.mrow.cited{background:var(--badbg)}
.mrow.cited .mt{max-height:none}
.mrow .ms{font-size:12.5px;color:var(--ink2)}
.mrow .mt{font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;word-break:break-word;max-height:168px;overflow:hidden}
.mlist{max-height:440px;overflow:auto;display:flex;flex-direction:column}

/* the lane grid (apps whose stories are a handful of messages per step) */
.gridwrap{overflow-x:auto;position:relative}
.grid{display:grid;position:relative}
.ax{padding:8px 6px;font-size:12px;color:var(--ink2)}
.ax .t{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink)}
.ax.gap{border-left:2px dashed #D6D6CF}
.ax.empty{opacity:.45}
.lane{font-size:12.5px;font-weight:650;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;padding:10px 8px;display:flex;align-items:flex-start;gap:7px;border-top:1px solid var(--line2)}
.cell{border-top:1px solid var(--line2);padding:7px 5px 18px;display:flex;flex-direction:column;gap:6px;min-height:44px;position:relative}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;margin-top:4px}
.act{font-size:13.5px;font-weight:600}
.msg{font-size:13px;line-height:1.38;border-radius:9px;padding:7px 9px;border:1px solid;cursor:pointer;text-align:left;background:none;width:100%;color:var(--ink);font-weight:450}
.msg .meta{font-size:11.5px;color:var(--ink2);display:flex;gap:6px;align-items:center;margin-bottom:2px;flex-wrap:wrap}
.msg.sel{box-shadow:0 0 0 3px var(--ink)}
.msg.ghost{opacity:.5;border-style:dashed;background:#FAFAF7}
.mark{font-weight:800;color:var(--ink)}
.badge{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px}
.b-added{background:var(--ink);color:#fff}.b-changed,.b-fuzzy{background:#fff;border:1px solid var(--ink)}.b-unchanged{background:#EEF0F4;color:var(--ink2)}.b-removed{background:#fff;border:1px dashed var(--ink2);color:var(--ink2)}
.live{position:absolute;height:4px;border-radius:2px}
.live.open::after{content:"→ open";position:absolute;right:-44px;top:-6px;font-size:10px;color:var(--ink2)}
.state{border-top:1px solid var(--line2);padding:10px 5px}
.state div{border-radius:6px;padding:6px 10px;font-size:12.5px;font-weight:500;background:#F0F0EE}
.more{font-size:12px;color:var(--ink2);background:none;border:none;padding:0;text-align:left}
.svg{position:absolute;inset:0;pointer-events:none;overflow:visible}

/* draft ticket */
.modal{position:fixed;inset:0;background:rgba(20,22,27,.38);display:grid;place-items:center;z-index:10;padding:28px}
.sheet{background:#fff;border-radius:16px;width:min(980px,100%);max-height:calc(100vh - 56px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet header,.sheet footer{padding:16px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line2)}
.sheet footer{border-bottom:0;border-top:1px solid var(--line2);flex-wrap:wrap}
.sheet header b{font:700 18px var(--disp)}
.tk{overflow:auto;padding:16px 26px 22px;font-size:15px;line-height:1.55}
.tk h3{font:700 19px/1.35 var(--disp);margin:4px 0 10px}
.tk h4{font:700 15px var(--sans);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-size:12.5px}
.tk p{margin:4px 0}
.tk blockquote{margin:6px 0;padding:8px 12px;border-left:3px solid var(--bad);background:var(--sunk);font:14px/1.5 var(--mono);white-space:pre-wrap}
.tk li{margin:2px 0}
@media (max-width:1500px){.three{grid-template-columns:repeat(2,minmax(0,1fr))}.steps{grid-template-columns:repeat(4,minmax(0,1fr))}.tile{min-width:120px}.tile .num{font-size:38px}}
@media (max-width:1200px){.work{grid-template-columns:1fr}.rail{position:static}.verdict{grid-template-columns:1fr}.vs,.relcmp{grid-template-columns:1fr}.neq,.arrow{padding:6px}}
</style>
</head>

      ${mini}<span class="meta">${chips(i)}${O.issues[i.id] ? `<span class="chip ver">owner: ${esc(O.issues[i.id].kind.replace(/_/g, ' '))}</span>` : ''}${i.memory && i.memory.status === 'fix_confirmed' ? `<span class="chip ver">✓ fix confirmed · ${esc(i.memory.decision)}</span>` : ''}</span></button>`;
  };
  const groups = GROUPS.filter(([k]) => !state.filter || state.filter === k).map(([k, label]) => {
    const xs = rankedAll(ALL.filter(i => group(i) === k));
    if (!xs.length) return '';
    return `<div class="box group"><div class="ghead"><span class="t ${k}">${esc(label)}</span><span class="c">${xs.length}</span></div>${xs.map(row).join('')}</div>`;
  }).join('');
  const none = !mine.length ? `<div class="box note"><div class="big">Nothing raised for ${esc(p.name)} in ${esc(HEAD)}</div><div class="muted">Every rule was evaluated on this story; the rules panel shows why each passed.</div></div>` : '';
  const nr = R.not_raised || [];
  const open = state.nrOpen ?? (nr.length <= 6 || !mine.length);
  const nrItem = x => { const ids = x.persona.split(','); const r = x.reason.length > 190 ? x.reason.slice(0, 188) + '…' : x.reason;
    return `<div class="nrrow" title="${esc(x.reason)}"><button class="linkbtn" data-goto="${esc(ids[0])}|">${esc(ids.map(pname).join(', '))}</button> · <span class="mono">${esc(x.rule)}</span>${x.label ? ` · <b>${esc(words(x.label))}</b>` : ` · ${esc(words(x.status))}`}<br><span class="muted" style="font-size:13px">${esc(r)}</span></div>`; };
  const nrBox = nr.length ? `<div class="box nr"><button class="linkbtn h" style="margin:0;color:var(--ink3)" data-toggle-nr>Evaluated and not raised · ${nr.length} ${open ? '▴' : '▾'}</button>${open ? nr.map(nrItem).join('') : ''}</div>` : '';
  return none + groups + nrBox;
}

// ---------------------------------------------------------------- whose story is on screen
function lens(p) {
  const opts = R.personas.map(x => { const n = anyFor(x.id).length; return `<option value="${esc(x.id)}" ${x.id === p.id ? 'selected' : ''}>${esc(x.name)} (${esc(x.id)}) · ${n} issue${n === 1 ? '' : 's'}</option>`; }).join('');
  const sum = (p.summary || []).filter(s => !/\{\w+\}/.test(s));
  return `<div class="box lens"><div class="who"><span class="ovl">The experience of · ${esc(words(p.role || NOUN))} ${esc(NOUN)}</span><div class="row" style="gap:12px;align-items:baseline"><h1>${esc(p.name)}</h1><span class="sum">${sum.map(esc).join(' · ')}</span></div></div>
    <div class="ctl"><div role="group" aria-label="Release">${[[BASE, 'base'], [HEAD, 'head'], ['diff', 'diff']].map(([l, m]) => `<button class="seg" data-mode="${m}" aria-pressed="${state.mode === m}">${esc(l)}</button>`).join('')}</div>
      <label class="sr" for="persona" style="position:absolute;left:-9999px">Persona</label><select id="persona">${opts}</select></div></div>`;

// ---------------------------------------------------------------- a captured message (crop of the page, or text)
function shotHtml(c, ok) {
  return `<a href="${esc(c.screenshot)}" target="_blank" rel="noopener" class="shot ${ok ? 'ok' : ''}" title="open the full capture (${esc(c.url || '')})" data-shot data-bx="${c.bbox.x}" data-by="${c.bbox.y}" data-bw="${c.bbox.width}" data-bh="${c.bbox.height}" style="background-image:url('${esc(c.screenshot)}')"><span class="hl"></span></a>`;
}
function moment(p, e, mark) {
  const x = e.extraction || {};
  let visual = '';
  const c = e.capture;
  const loc = (e.evidence && e.evidence.locator) || {};
  if (c && c.kind === 'web' && c.screenshot && c.bbox) {
    visual = shotHtml(c) + `<div class="faint" style="font-size:12px">captured ${esc(c.url || '')} · <span class="mono">${esc(loc.css || '')}</span></div>`;
  } else if (c) {
    const where = loc.kind === 'message_id' ? `message ${loc.message_id}` : loc.kind === 'notification_id' ? `notification ${loc.notification_id}`
      : loc.kind === 'chat_turn' ? `chat turn ${loc.turn + 1}` : esc(loc.kind || '');
    const head = {email: `✉ ${esc(FNAME[e.feature] || e.feature)} → ${esc(p.name)}`, push: `▣ push notification`, chat: `◌ ${esc(FNAME[e.feature] || e.feature)} chat`}[c.kind] || esc(c.kind);
    visual = `<div class="envelope"><b style="color:var(--ink)">${head}</b> · sent ${hm(e.at)} · ${where}</div>`;
  }
  const claims = (x.claims || []).map(cl => { const name = esc(cl.type.replace(/_/g, ' ')), val = esc(String(cl.shown ?? cl.when ?? cl.value));
    // the verdict comes from review.json (relate/claims.py), never compared here
    if (cl.verdict == null) return `<span class="chip conf" title="no oracle value at this moment">${name} ${val}</span>`;
    if (cl.verdict === 'unreadable') return `<span class="chip conf" title="this claim could not be read in the form the true value takes">${name} ${val} · not readable</span>`;
    return cl.verdict === 'match' ? `<span class="chip ver">${name} ${val} ✓ true</span>` : `<span class="chip sev-critical">${name} ${val} ✗ true value ${esc(String(cl.truth))}</span>`; }).join('');
  return `<div class="moment f-${cls(e.feature)}">
    <div class="mh">${mark ? `<b style="color:var(--ink);font-size:15px">${mark}</b> · ` : ''}<span class="mono">${rel(e.at)}</span> · <b style="color:var(--ink)">${esc(FNAME[e.feature] || e.feature)}</b> · ${esc(e.surface.replace(/_/g, ' '))} · ${esc(e.channel)}</div>
    ${visual}<div class="quote">“${esc(e.text)}”</div>
    <div class="row" style="gap:6px">${claims}${x.message_kind === 'directive' ? `<span class="chip conf">${esc(x.action)} · ${esc(x.strength)}</span>` : x.message_kind ? `<span class="chip conf">${esc(x.message_kind)}</span>` : ''}${e.live_basis ? `<span class="chip conf">live until ${e.live_until ? (e.live_until.slice(0, 10) === e.at.slice(0, 10) ? hm(e.live_until) : rel(e.live_until).slice(0, -3)) : 'unknown'} (${esc(e.live_basis.replace(/_/g, ' '))})</span>` : ''}</div></div>`;
}

// ---------------------------------------------------------------- shown vs true, base vs head
function versus(i, occ, p, e, r, pr) {
  const q = (occ.quotes || [])[0] || '';
  const c = e && e.capture;
  let body;
  const crop = !!(c && c.kind === 'web' && c.screenshot && c.bbox && c.bbox.width <= 520);
  if (crop) {
    body = shotHtml(c) + `<div class="text" style="max-height:none;font-size:15px">“<mark class="q">${markFig(esc(q || e.text), pr && pr.shown)}</mark>”</div>`;
  } else {
    const x = excerpt(e ? e.text : q, {quote: q, fig: pr && pr.shown, maxChars: 520, before: 7, after: 4});
    body = `<div class="text">${x.html}</div>`;
  }
  const relName = r === 'head' ? HEAD : BASE;
  // A short message is read beside its neighbours on the same page, in the order the page showed them.
  let near = '';
  if (e && e.text.length < 140 && e.channel === 'page') {
    const same = evs(p, r).filter(x => x.kind === 'message' && x.step_id === e.step_id && x.surface === e.surface);
    const k = same.indexOf(e);
    const ctx = k < 0 ? [] : same.slice(Math.max(0, k - 2), k + 3);
    if (ctx.length > 1) near = `<div class="near"><div class="faint" style="font-size:12px;margin-bottom:2px">On the same page, in order</div>${ctx.map(x => `<div class="nr1 ${x === e ? 'me' : ''}">${x === e ? `<mark class="q">${markFig(esc(x.text), pr && pr.shown)}</mark>` : esc(x.text.length > 110 ? x.text.slice(0, 108) + '…' : x.text)}</div>`).join('')}</div>`;
  }
  const cmp = (occ.compared_with || []).map(cw => { const ce = cited(p, r, cw.event, [cw.quote]);
    return `<div>compared with <b style="color:var(--ink)">${esc(ce ? surfaceName(ce) : cw.event)}</b>: <span class="mono">“${esc(cw.quote.replace(/\s*\n\s*/g, ' · '))}”</span></div>`; }).join('');
  const shownCard = `<div class="vcard shown"><div class="cap"><span>${CHAN[e ? e.channel : ''] || '▤'}</span><b>What ${esc(p.name)} was shown</b><span>· ${esc(surfaceName(e))} · ${esc(relName)}${e ? ' · ' + hm(e.at) : ''}</span>${c && c.screenshot ? `<a href="${esc(c.screenshot)}" target="_blank" rel="noopener" style="margin-left:auto;color:var(--accent)">capture ↗</a>` : ''}</div>
    ${pr && pr.shown ? `<div class="val">${esc(pr.shown)}</div>` : ''}${near ? (crop ? shotHtml(c) : '') + near : body}${cmp ? `<div class="cmp">${cmp}</div>` : ''}</div>`;
  const trueCard = `<div class="vcard true"><div class="cap"><span>✓</span><b>What is true</b></div>
    ${pr && pr.truth ? `<div class="val">${esc(pr.truth)}</div><div class="src">${srcLabel(pr, r)}</div>` : `<div class="src">No record value in this review for this figure.</div>`}
    ${recordTable(pr, p, e, r)}<p class="why" style="margin-top:auto">${esc(i.why)}</p></div>`;
  return `<div class="vs">${shownCard}<div class="neq" aria-hidden="true">≠</div>${trueCard}</div>`;
}
// The rest of the same record (or reference), so the true value is seen in its source, not alone.
function recordTable(pr, p, e, r) {
  if (!pr || !pr.fact || !['record', 'reference', 'oracle'].includes(pr.source)) return '';
  const T = (X.truth || {})[p.id] || {};
  let src = {};
  if (pr.source === 'reference') src = T.reference || {};
  else { const snaps = r === 'head' ? (p.state || []) : (T.base_state || []); for (const s of snaps) { if (e && t(s.at) > t(e.at)) break; Object.assign(src, s.truth); } }
  const like = pr.shown || '';
  const rows = Object.entries(src).filter(([k, v]) => typeof v === 'number' || (v && typeof v === 'object' && 'at_least' in v)).slice(0, 8);
  if (rows.length < 2) return '';
  return `<div class="rtab"><div class="faint" style="font-size:12px;margin-bottom:4px">${pr.source === 'reference' ? 'The contract reference for this ' + esc(NOUN) : 'The record at this moment'}</div>${rows.map(([k, v]) =>
    `<div class="rr ${k === pr.fact || k.startsWith(pr.fact + '@') ? 'hit' : ''}"><span class="mono">${esc(k)}</span><span class="tnum">${esc(fmtLike(v, (/total|amount|price|fee|tax|limit|room|worth|income|spend|balance|saved|assets|debt|target|contribution|equity/.test(k) && !/(^|_)(quantity|count|units|age|months|score|rate|left)(_|@|$)/.test(k)) ? like : ''))}</span></div>`).join('')}</div>`;
}
function releaseCompare(i, occ, p, e, r) {
  if (!e) return '';
  const other = counterpart(p, e, r);
  const bE = r === 'base' ? e : other, hE = r === 'head' ? e : other;
  const qs = occ.quotes || [], q = qs[0] || '';
  const pr = pairFor(i, occ, p, e, r);
  const anchor = stripFig(q, pr && pr.shown);
  const col = (ev, name, sub) => {
    if (!ev) return `<div class="relcol"><div class="rh"><span class="rn">${esc(name)}<small>${esc(sub)}</small></span><span class="st none">○ message not shown</span></div><div class="muted">No matching message in ${esc(name)}'s story for ${esc(p.name)}.</div></div>`;
    const has = qhit(ev, qs);
    const x = has ? excerpt(ev.text, {quote: q, fig: pr && pr.shown, before: 1, after: 1}) : excerpt(ev.text, {anchor, cls: 'now', before: 1, after: 1});
    const st = has ? `<span class="st bad">● shows the quoted text</span>` : `<span class="st good">✓ ${name === HEAD ? 'no longer shows it' : 'does not show it'}</span>`;
    return `<div class="relcol"><div class="rh"><span class="rn">${esc(name)}<small>${esc(sub)} · ${esc(surfaceName(ev))}</small></span>${st}</div><div class="text">${x.html}</div></div>`;
  };
  return `<div><p class="h">How it changed between releases</p><div class="relcmp">${col(bE, BASE, 'base')}<div class="arrow">→</div>${col(hE, HEAD, 'head')}</div>
    <div class="basis" style="margin-top:8px">${deltaPill(i)} <span style="margin-left:6px">${esc(i.delta_basis)}</span></div></div>`;
}
function coherenceCompare(i, p, evsList) {     // per cited message: was it there in the base release?
  if (!evsList.length) return '';
  const rows = evsList.map((e, k) => { const b = counterpart(p, e, 'head');
    return `<tr><td><b>${'ABCDE'[k]}</b> · ${esc(FNAME[e.feature] || e.feature)} ${esc(e.channel)}</td><td>${b ? `<span class="st none">shown${b.text === e.text ? ', same text' : ', other text'}</span>` : `<span class="st bad">not shown in ${esc(BASE)}</span>`}</td><td><span class="st">${e.delta ? esc(e.delta.replace('_', ' ')) : 'shown'} in ${esc(HEAD)}</span></td></tr>`; }).join('');
  return `<div><p class="h">How it changed between releases</p><table class="ctable"><tr><th>message</th><th>${esc(BASE)}</th><th>${esc(HEAD)}</th></tr>${rows}</table>
    <div class="basis" style="margin-top:8px">${deltaPill(i)} <span style="margin-left:6px">${esc(i.delta_basis)}${i.features.length ? ' · features: ' + i.features.map(f => esc(FNAME[f] || f)).join(', ') : ''}</span></div></div>`;
}

// ---------------------------------------------------------------- why trust it
function trust(i, occ) {
  const v = i.verification, vs = v.steps || {}, sevF = i.severity.factors || {};
  const ev = vs.evidence_linked;
  const withQ = i.occurrences.filter(o => (o.quotes || []).length).length;
  const refused = ev && ev.result === 'fail' ? ((String(ev.detail || '').match(/^(\d+) citation/) || [])[1]) : null;
  const unq = unquoted(i);
  const evBox = ev ? `<div class="box"><p class="h">Evidence</p><div class="lvl ${ev.result === 'pass' ? 'good' : 'warn'}">${ev.result === 'pass' ? '✓ Quotes found' : '✗ Some citations refused'}</div>
      <div class="muted">${withQ ? `${esc(nouns(withQ))} whose quoted text was found in their own captured message` : esc(STEP.evidence_linked[1][ev.result] || ev.result)}${refused ? ` · ${refused} citation${refused === '1' ? '' : 's'} refused (quote not in the cited message)` : ''}${unq.length ? ` · ${unq.length} more named without a usable quote, not counted` : ''}</div></div>`
    : `<div class="box"><p class="h">Evidence</p><div class="lvl dim">Not checked</div><div class="muted">no evidence step recorded</div></div>`;
  const vline = Object.entries(vs).map(([k, s]) => `<div class="vstep v-${s.result}" title="${esc(typeof s.detail === 'string' ? s.detail : JSON.stringify(s.detail || ''))}"><span>${{pass: '✓', fail: '✗', not_run: '○', not_applicable: '–'}[s.result] || ''} ${esc(STEP[k] ? STEP[k][0] : k.replace(/_/g, ' '))}</span><span>${esc(stepResult(k, s))}${s.occurrences ? ` · ${Object.values(s.occurrences).filter(x => x === 'pass').length}/${Object.keys(s.occurrences).length}` : ''}</span></div>`).join('');
  const vcls = v.status === 'verified' ? 'good' : v.status === 'failed' ? 'bad' : 'dim';
  const ccls = i.confidence.level === 'high' ? 'good' : i.confidence.level === 'low' ? 'warn' : 'dim';
  return `<div class="three">
    ${evBox}
    <div class="box"><p class="h">Confidence</p><div class="lvl ${ccls}">${esc(words(i.confidence.level))}</div><ul class="basisl">${(i.confidence.basis || []).map(b => `<li>${esc(b.length > 110 ? b.slice(0, 108) + '…' : b)}</li>`).join('')}</ul></div>
    <div class="box"><p class="h">Verification</p><div class="lvl ${vcls}">${esc(words(v.status))}</div>${v.reason ? `<div class="muted">${esc(v.reason)}</div>` : ''}<div class="vsteps">${vline}</div></div>
    <div class="box"><p class="h">Severity</p><div class="lvl">${esc(words(i.severity.level))}</div>
      <div class="muted">set by the owner: rule ${esc(sevF.rule)}${sevF.set_by === 'severity_by_label' ? ` sets ${esc((sevF.label || '').replace(/_/g, ' '))} at ${esc(i.severity.level)}` : ` (${esc(sevF.base)})`}${sevF.reader_rating ? ` · the reader rated it ${esc(sevF.reader_rating)}` : ''} · seen in ${esc(sevF.tested_personas)} test persona${sevF.tested_personas === 1 ? '' : 's'}; test personas are not production reach</div></div>
  </div>`;
}
function modelStrip() {
  const m = R.manifest || {}, sp = m.spend || {};
  const by = {};
  for (const [role, mm] of Object.entries(MODELS)) if (role !== 'smoke') (by[mm] = by[mm] || []).push(role);
  const reader = R.mode === 'reader';
  const verbs = roles => reader ? 'read every capture beside the record and named the issues' : [...new Set(roles.map(r => r.startsWith('cross_checker') ? 're-derives each finding' : r === 'defender'
    ? 'argues against it' : 'reads what each message means'))].join(' and ');
  const models = reader ? (MODELS.interpreter ? [[MODELS.interpreter, ['interpreter']]] : []) : Object.entries(by);
  const ms = models.map(([mm, roles]) => `<span><b>${esc(modelName(mm))}</b> <span class="mono faint" style="font-size:12px">${esc(mm)}${provider(roles[0]) ? ' · ' + esc(provider(roles[0])) : ''}</span> ${esc(verbs(roles))}</span>`).join('');
  const cost = `<span>cost <b>$${(R.cost_usd || 0).toFixed(2)}</b> this run${sp.calls ? ` · ${sp.calls} call${sp.calls === 1 ? '' : 's'}${sp.cached ? `, ${sp.cached} from cache` : ''}` : ''}${sp.if_fresh_usd ? ` · <b>$${sp.if_fresh_usd.toFixed(2)}</b> if read fresh` : ''}</span>`;
  const code = reader ? '<span>SRA code checked each quote against the captures, grouped the findings and dated them by release</span>' : '<span>code tracks time, state and the owner\'s rules</span>';
  return `<div class="modelstrip">${ms}${cost}${code}${ONE_FAMILY && !reader ? '<span>one model family: a second model\'s agreement is a second pass, not independent agreement</span>' : ''}</div>`;
}
const modelLine = () => (Object.keys(MODELS).length || (R.manifest || {}).spend) ? modelStrip() : '';

// ---------------------------------------------------------------- issue detail
function detail(p) {
  const i = byId(state.issue);
  if (!i || (!occurrence(i, p.id) && !anyFor(p.id).length && i.layer === 'release')) return rulesPanel(p);
  const occ = occurrence(i, p.id) || i.occurrences[0];
  const pv = personas[occ.persona] || p;
  const r = relOf(i);
  const evList = occ.events.map(id => cited(pv, r, id, occ.quotes)).filter(e => e && e.kind === 'message');
  const e = evList[0];
  const factualView = i.layer === 'factual' || (occ.quotes || []).length;
  const pr = factualView ? pairFor(i, occ, pv, e, r) : null;
  const lead = pr && pr.shown && pr.truth
    ? `<p class="lead">${esc(pv.name)} was shown <b class="s">${esc(pr.shown)}</b> ${/^(your|the)\b/i.test(surfaceName(e)) ? 'in' : 'in the'} ${esc(surfaceName(e).replace(/^./, c => c.toLowerCase()))}; ${pr.source === 'reader' ? 'the reader says the true value is' : pr.source === 'reference' ? 'for this ' + esc(NOUN) + ' the contract says' : 'the app\'s record says'} <b class="t">${esc(pr.truth)}</b>${pr.fact ? ` (${esc(factWords(pr.fact))})` : ''}.</p>`
    : `<p class="lead"><span class="faint" style="font-weight:600">Why: </span>${esc(i.why)}</p>`;

  const main = factualView && e
    ? versus(i, occ, pv, e, r, pr) + releaseCompare(i, occ, pv, e, r)
    : `<div class="moments">${evList.map((x, k) => (k ? `<div class="swap" aria-hidden="true">⇄</div>` : '') + moment(pv, x, marks[k])).join('')}</div>` + (r === 'head' ? coherenceCompare(i, pv, evList) : '');
  const occs = i.occurrences;
  const unq = unquoted(i);
  const who = `<div class="whobox"><p class="h" style="margin:0">Who saw it · ${esc(nouns(i.personas.length))}${occs.some(o => o.quotes) ? ', each with its quote found in their own capture' : ''}</p>
    <div class="pchips">${occs.slice(0, 60).map(o => `<button class="pchip" data-occ="${esc(o.persona)}" aria-pressed="${o.persona === pv.id}">${esc(pname(o.persona))}</button>`).join('')}${occs.length > 60 ? `<span class="muted">+${occs.length - 60} more</span>` : ''}</div>
    ${unq.length ? `<div class="muted" style="font-size:13px">Also named without a usable quote, not counted: ${unq.map(x => esc(pname(x))).join(', ')}</div>` : ''}</div>`;
  const ticketBtn = `<button class="btn accent" data-ticket="1">Draft ticket</button>`;
  const storyBtn = `<button class="btn" data-story="1">${esc(pv.name)}'s story ↓</button>`;
  return `<section class="box detail" aria-label="Issue detail">
    <div class="dhead"><div style="min-width:0">${deltaPill(i, true)}<h2>${esc(issueTitle(i))}${i.layer === 'release' && i.features.length > 1 ? ' between ' + i.features.map(f => esc(FNAME[f] || f)).join(' and ') : ''}</h2>
      <div class="id mono">${esc(i.id)}</div></div>
      <div class="acts">${storyBtn}${ticketBtn}${ownerBlock(i)}</div></div>
    ${memoryNote(i.memory)}
    ${occ.persona !== p.id ? `<div class="muted">This issue is in ${esc(i.personas.map(pname).join(', '))}'s stories; showing ${esc(pv.name)}.</div>` : ''}
    ${lead}
    ${main}
    ${who}
    <div><p class="h">Why you can trust it</p>${trust(i, occ)}</div>
    ${modelLine()}

// ---------------------------------------------------------------- draft ticket
function mdLite(md) {
  const out = []; let list = false, quote = [];
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const flushQ = () => { if (quote.length) { out.push(`<blockquote>${quote.map(esc).join('\n')}</blockquote>`); quote = []; } };
  const lines = [];                   // a line repeated back to back (one per persona) is shown once, with its count
  for (const line of md.split('\n')) { const last = lines[lines.length - 1]; if (last && last.text === line && line.trim()) last.n++; else lines.push({text: line, n: 1}); }
  for (const {text: line0, n} of lines) { const line = n > 1 ? `${line0} (×${n})` : line0;
    if (/^>/.test(line)) { quote.push(line.replace(/^> ?/, '')); continue; }
    flushQ();
    if (/^\d+\. /.test(line)) { if (!list) { out.push('<ol>'); list = true; } out.push(`<li>${inline(line.replace(/^\d+\. /, ''))}</li>`); continue; }
    if (list) { out.push('</ol>'); list = false; }
    if (/^# /.test(line)) out.push(`<h3>${inline(line.slice(2))}</h3>`);
    else if (/^## /.test(line)) out.push(`<h4>${inline(line.slice(3))}</h4>`);
    else if (/^---/.test(line)) out.push('<hr style="border:0;border-top:1px solid var(--line2);margin:14px 0">');
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  flushQ(); if (list) out.push('</ol>');
  return out.join('');
}

  for (const a of document.querySelectorAll('[data-crop]')) {
    const W = a.clientWidth, H = a.clientHeight, bx = +a.dataset.bx, by = +a.dataset.by, bw = +a.dataset.bw, bh = +a.dataset.bh;
    const scale = Math.min(0.75, W / (bw + 160));
    const x0 = Math.max(0, Math.min(CAPW - W / scale, bx + bw / 2 - W / scale / 2)), y0 = Math.max(0, by + bh / 2 - H / scale / 2);
    a.style.backgroundSize = `${CAPW * scale}px auto`;
    a.style.backgroundPosition = `-${x0 * scale}px -${y0 * scale}px`;
    Object.assign(a.querySelector('.hl').style, {left: `${(bx - x0) * scale - 3}px`, top: `${(by - y0) * scale - 3}px`, width: `${bw * scale + 6}px`, height: `${Math.max(bh * scale, 8) + 6}px`});
  }
}
function pick(id) {
  const i = byId(id);
  if (!i) return set({issue: id});
  const pid = i.personas.includes(state.persona) ? state.persona : personaOf(i);
  const r = relOf(i);
  const occ = occurrence(i, pid);
  const e = occ && occ.events.length ? cited(personas[pid], r, occ.events[0], occ.quotes) : null;
  set({issue: id, persona: pid, mode: r === 'base' ? 'base' : (state.mode === 'diff' ? 'diff' : 'head'), step: e ? e.step_id : null});
}
if (!location.hash && top) { const occ = occurrence(top, state.persona); const e = occ && occ.events.length ? cited(personas[state.persona], relOf(top), occ.events[0], occ.quotes) : null; state.step = e ? e.step_id : null; }

document.addEventListener('click', ev => {
  const el = ev.target.closest('button, a, [data-close-ticket]');
  if (!el) return;
  if (el.dataset.closeTicket && (el.tagName === 'BUTTON' || ev.target === el)) set({ticket: false});
  else if (el.dataset.mode) set({mode: el.dataset.mode});
  else if (el.dataset.filter) set({filter: state.filter === el.dataset.filter ? null : el.dataset.filter});
  else if (el.dataset.issue) pick(el.dataset.issue);
  else if (el.dataset.goto) { const [p, i] = el.dataset.goto.split('|'); if (i) { set({persona: p, mode: 'head'}); pick(i); } else set({persona: p, issue: (anyFor(p)[0] || {}).id || null, mode: 'head', step: null}); }
  else if (el.dataset.occ) { const i = byId(state.issue); const o = occurrence(i, el.dataset.occ); const e = o && o.events.length ? cited(personas[o.persona], relOf(i), o.events[0], o.quotes) : null; set({persona: el.dataset.occ, step: e ? e.step_id : null}); }
  else if (el.dataset.step) set({step: state.step === el.dataset.step ? null : el.dataset.step});
  else if (el.dataset.ticket) set({ticket: true});
  else if (el.dataset.story) { const s = $('#story'); if (s) s.scrollIntoView({behavior: 'smooth', block: 'start'}); }
  else if (el.hasAttribute('data-toggle-nr')) { const nr = R.not_raised || []; set({nrOpen: !(state.nrOpen ?? (nr.length <= 6 || !anyFor(state.persona).length))}); }
  else if (el.dataset.copy) { try { navigator.clipboard.writeText(el.dataset.copy); el.textContent = 'Copied'; } catch (e) {} }
  else if (el.dataset.expand) { const [f, k] = el.dataset.expand.split(':'); const p = personas[state.persona];
    const cell = document.querySelector(`[data-cell="${f}:${k}"]`); const all = p.events.filter(e => e.kind === 'message' && e.feature === f && colOf(e.at) === +k);
    cell.innerHTML = all.map(e => card(e, {})).join(''); }
  else if (el.dataset.ev && !el.dataset.ghost) { const p = personas[state.persona]; const e = p.events.find(x => x.id === el.dataset.ev);
    const hit = ALL.find(i => (occurrence(i, p.id) || {events: []}).events.includes(e.id));
    if (hit) set({issue: hit.id}); else if (e.capture && e.capture.screenshot) window.open(e.capture.screenshot, '_blank'); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && state.ticket) set({ticket: false}); });
document.addEventListener('change', ev => { if (ev.target.id === 'persona') { const pid = ev.target.value; const mine = anyFor(pid); const top2 = rankedAll(mine.filter(i => i.layer === 'release'))[0] || rankedAll(mine)[0];
  if (top2) { set({persona: pid}); pick(top2.id); } else set({persona: pid, issue: null, step: null}); } });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 120); });
render();
})();
