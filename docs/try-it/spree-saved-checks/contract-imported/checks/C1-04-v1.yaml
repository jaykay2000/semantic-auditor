source:
  ref: C1#04
  trial: C1
  heading: F5 — Email (current) shows delivery as $0.00 AND a -$15.00 promotion; summary
    doesn't add up
  claim: Email (current) shows delivery as $0.00 AND a -$15.00 promotion; summary
    doesn't add up
  where: 'confirmation email #R1004 (current), shopper b1.cur@example.test (Ben Beta,
    Buffalo NY 14201), 2 × Drip Coffee Maker, Express, FREESHIP. Both text and HTML
    parts.'
  shown: '(text part): "Subtotal: $179.98 / Promotion: Promotion (Free Shipping) -$15.00
    / Shipping: Express $0.00 / Tax: $14.40 / Order Total: $194.38". HTML part: "Shipping
    Express $0.00".'
  should_be: 'Shipping Express $15.00 (record delivery_total 15.00, fulfillment cost
    15.00, discount -15.00) — as checkout, order page and admin show. As shown, 179.98
    − 15.00 + 0.00 + 14.40 = 179.38 ≠ 194.38: the free-shipping discount is counted
    twice.'
  reproduce: '2 × Drip Coffee Maker → NY address → Express → apply FREESHIP → Check
    → place order → read email. How checked: message read via API; compared to record
    /order/current/R1004 and to the candidate''s email for the identical order (candidate
    R1004 shows "Shipping: Express $15.00").'
  rule: R3 (component counted twice), R2 (email ≠ order page/admin "Shipping $15.00").
  sha256: 56fe83f330017d8f
