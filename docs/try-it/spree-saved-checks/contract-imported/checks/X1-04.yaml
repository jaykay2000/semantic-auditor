id: X1-04
source:
  ref: X1#04
  trial: X1
  heading: Store Pickup orders provide no pickup address or instructions (no rule;
    present in both)
  claim: 'Checkout offers `Store Pickup $0.00` and allows the order to be placed,
    but neither the order page nor confirmation email tells the shopper where or how
    to collect it. The order page instead labels the shopper''s home address as `Shipping
    Address`, which can suggest delivery even though Store Pickup was chosen. The
    record confirms the pickup stock location has no address, phone, readiness time,
    or pickup instructions and has `pickup_point_data: null`.'
  where: Current order page `http://127.0.0.1:4030/us/en/order-placed/cart_C9SrJgpzQ4`,
    shopper `current-california-store-pickup-q1@example.test`, order `R1006`; candidate
    order page `http://127.0.0.1:4031/us/en/order-placed/cart_98FqgRua4h`, shopper
    `candidate-california-store-pickup-q1@example.test`, order `R1006`. Both email
    alternatives
  shown: 'Both say `Shipping Method` / `Store Pickup` / `$0.00`, then `Shipping Address`
    / `Alex Audit` / `123 Test Street` / `Los Angeles, CA 90012` with no pickup location
    or instructions. Both email alternatives only say `Shipping: Store Pickup $0.00`
    and likewise give no collection details.'
  should_be: A pickup option should identify the pickup location and provide the information
    needed to collect the order (or it should not be offered until that information
    is configured). No rule directly requires pickup instructions, but the current
    confirmation is materially misleading and unusable for a pickup shopper.
  reproduce: Add the White Personal Blender; proceed with a California address; select
    Store Pickup; place with Check; inspect the order page and confirmation email
    for a collection address or instructions.
  rule: no rule
  sha256: e455cbb9f52d2a8f
