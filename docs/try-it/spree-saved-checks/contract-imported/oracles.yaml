- id: order
  endpoint: /_semaudit/oracle/order/{order_number}
  fields:
    item_total: $.item_total
    discount_total: $.discount_total
    delivery_total: $.delivery_total
    fee_total: $.fee_total
    tax_total: $.tax_total
    additional_tax_total: $.additional_tax_total
    included_tax_total: $.included_tax_total
    total: $.total
    amount_due: $.amount_due
    gift_card_total: $.gift_card_total
    store_credit_total: $.store_credit_total
    total_quantity: $.total_quantity
    currency: $.currency
    market_tax_inclusive: $.market.tax_inclusive
    items: $.items
    discounts: $.discounts
    fulfillments: $.fulfillments
    payments: $.payments
    number: $.number
    email: $.email
    coupon_code: $.coupon_code
    shipping_address: $.shipping_address
    payment_status: $.payment_status
    fulfillment_status: $.fulfillment_status
    completed_at: $.completed_at
- id: store_config
  endpoint: /_semaudit/oracle/store_config
  fields:
    delivery_methods: $.delivery_methods
    domestic_methods: $.domestic_methods
    promotions: $.promotions
    automatic_promotions: $.automatic_promotions
    tax_rates: $.tax_rates
    payment_methods_shopper: $.payment_methods_shopper
    fees: $.fees
