<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concierge · Northbound</title>
<style>
  body { font-family: Helvetica, Arial, sans-serif; color: #1b2733; background: #f6f8fa; margin: 0; line-height: 1.45; }
  header { background: #0d3b66; color: #fff; padding: 12px 24px; display: flex; gap: 24px; align-items: center; }
  header a { color: #fff; text-decoration: none; }
  header .brand { font-weight: bold; font-size: 20px; }
  header .who { margin-left: auto; font-size: 14px; opacity: .9; }
  main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  .msg-wrap { background: #fff; border: 1px solid #d6dde4; border-radius: 6px; padding: 12px 16px; margin: 10px 0;
              display: flex; gap: 16px; align-items: center; justify-content: space-between; }
  .msg-wrap .msg { flex: 1; }
  .msg-card { color: #31475c; }
  .msg-chat { color: #1b2733; }
  .btn, button { background: #0d3b66; color: #fff; border: 0; border-radius: 4px; padding: 8px 14px; font-size: 14px;
                 text-decoration: none; cursor: pointer; white-space: nowrap; }
  form { margin: 0; }
  label { font-size: 14px; margin-right: 8px; }
  input[type=text] { padding: 6px; font-size: 14px; }
  .search { display: flex; gap: 12px; align-items: end; margin-bottom: 16px; flex-wrap: wrap; }
  .turn { margin: 8px 0; }
  .user-turn { background: #e8f0f8; border-radius: 6px; padding: 8px 12px; margin: 10px 0; text-align: right; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">Northbound</a>
  <nav><a href="/search">Search</a> &nbsp; <a href="/concierge">Concierge</a> &nbsp; <a href="/booking/NB0001">My booking</a></nav>
  <span class="who">The Okafors · 4 travellers</span>
</header>
<main>

<h1>Concierge</h1>
<div class="msg-wrap"><div class="msg msg-chat" data-feature="concierge" data-message-key="cg.greeting" data-shown-at="2026-11-04T09:02:00+00:00" data-component="flight" data-channel="chat">Hi, I'm Concierge. Ask me about your booking, fares, refunds or Price Watch.</div></div>


  <div class="msg-wrap"><div class="msg msg-chat" data-feature="concierge" data-message-key="cg.upgrade" data-shown-at="2026-11-02T13:00:00+00:00" data-component="flight" data-channel="chat">You can still switch to a refundable fare for €30 until tomorrow 10:06.</div></div>

  <div class="user-turn">Did I get a good deal?</div>

  <div class="msg-wrap"><div class="msg msg-chat" data-feature="concierge" data-message-key="cg.regret" data-shown-at="2026-11-04T09:02:00+00:00" data-component="flight" data-channel="chat">You should have booked a refundable fare.</div></div>

<form method="post" action="/concierge"><label>Your question <input type="text" name="text" size="40"></label><button type="submit">Ask</button></form>

</main>

</body></html>
